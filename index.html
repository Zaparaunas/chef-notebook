<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Техкарты Шефа</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #181c22);
            --text-color: var(--tg-theme-text-color, #ffffff);
            --hint-color: var(--tg-theme-hint-color, #999999);
            --button-color: var(--tg-theme-button-color, #2481cc);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
            --secondary-bg-color: var(--tg-theme-secondary-bg-color, #232931);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }
        h2, h3, h4 { margin-top: 0; }
        .mode-toggle {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .mode-btn {
            flex: 1;
            padding: 10px;
            border: 1px solid var(--button-color);
            background: transparent;
            color: var(--button-color);
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }
        .mode-btn.active {
            background: var(--button-color);
            color: var(--button-text-color);
        }
        .action-btn {
            background: var(--button-color);
            color: var(--button-text-color);
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 15px;
        }
        /* Рубрикатор категорий */
        .categories-grid {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 15px;
        }
        .category-chip {
            background: var(--secondary-bg-color);
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 13px;
            white-space: nowrap;
            cursor: pointer;
            border: 1px solid transparent;
        }
        .category-chip.active {
            border-color: var(--button-color);
            font-weight: bold;
        }
        /* Карточки рецептов */
        .recipe-card {
            background: var(--secondary-bg-color);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 12px;
        }
        /* Конструктор */
        .admin-panel {
            background: var(--secondary-bg-color);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #444;
            border-radius: 6px;
            box-sizing: border-box;
            background: var(--bg-color);
            color: var(--text-color);
        }
        #recipeTitle {
            font-size: 18px;
            font-weight: bold;
            border: 2px solid var(--button-color);
        }
        .ingredient-row, .step-row {
            display: flex;
            flex-direction: column;
            gap: 5px;
            background: var(--bg-color);
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 8px;
            border: 1px solid #333;
        }
        .pro-fields {
            display: flex;
            gap: 5px;
        }
        .actions-row {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="mode-toggle">
        <button id="btnSimple" class="mode-btn active" onclick="setMode('simple')">Режим: Дом</button>
        <button id="btnPro" class="mode-btn" onclick="setMode('pro')">Режим: Pro</button>
    </div>

    <!-- Кнопка создания техкарты -->
    <button id="createRecipeBtn" class="action-btn" onclick="openConstructor()">+ Новая техкарта</button>

    <!-- Рубрикатор категорий -->
    <div id="categoryClassifier" class="categories-grid">
        <div class="category-chip active" onclick="filterCategory('Все')">Все</div>
        <div class="category-chip" onclick="filterCategory('Мясо и птица')">🥩 Мясо и птица</div>
        <div class="category-chip" onclick="filterCategory('Рыба и морепродукты')">🐟 Рыба</div>
        <div class="category-chip" onclick="filterCategory('Овощи и грибы')">🥦 Овощи</div>
        <div class="category-chip" onclick="filterCategory('Крупы, макароны и бобовые')">🌾 Крупы</div>
        <div class="category-chip" onclick="filterCategory('Супы')">🍲 Супы</div>
        <div class="category-chip" onclick="filterCategory('Холодные блюда и закуски')">🥗 Закуски</div>
        <div class="category-chip" onclick="filterCategory('Соусы, маринады и заправки')">🍯 Соусы</div>
        <div class="category-chip" onclick="filterCategory('Полуфабрикаты и заготовки')">🍳 Заготовки</div>
        <div class="category-chip" onclick="filterCategory('Выпечка и десерты')">🥐 Десерты</div>
        <div class="category-chip" onclick="filterCategory('Напитки')">🍷 Напитки</div>
        <div class="category-chip" onclick="filterCategory('Другое')">📌 Другое</div>
    </div>

    <!-- Конструктор / Редактор техкарт -->
    <div class="admin-panel" id="adminPanel" style="display: none;">
        <h3 id="constructorTitle">➕ Новая техкарта</h3>
        
        <input type="text" id="recipeTitle" placeholder="Введите название блюда..." oninput="checkTitleInput(); saveDraftLocally();">

        <div id="constructorBody" style="display: none;">
            <select id="recipeCategory" onchange="saveDraftLocally()">
                <option value="" disabled selected>Выберите категорию...</option>
                <option value="Мясо и птица">Мясо и птица</option>
                <option value="Рыба и морепродукты">Рыба и морепродукты</option>
                <option value="Овощи и грибы">Овощи и грибы</option>
                <option value="Крупы, макароны и бобовые">Крупы, макароны и бобовые</option>
                <option value="Супы">Супы</option>
                <option value="Холодные блюда и закуски">Холодные блюда и закуски</option>
                <option value="Соусы, маринады и заправки">Соусы, маринады и заправки</option>
                <option value="Полуфабрикаты и заготовки">Полуфабрикаты и заготовки</option>
                <option value="Выпечка и десерты">Выпечка и десерты</option>
                <option value="Напитки">Напитки</option>
                <option value="Другое">Другое</option>
            </select>

            <div style="margin-bottom: 15px; display: flex; align-items: center; gap: 10px;">
                <label style="font-size: 13px; color: var(--hint-color);" id="portionsLabel">Порции: <span id="portionsValue">4</span></label>
                <div id="portionsContainer" style="flex: 1;">
                    <input type="range" id="recipePortionsRange" min="1" max="20" value="4" oninput="updatePortionsVal(this.value); saveDraftLocally()" style="margin-bottom: 0;">
                </div>
            </div>

            <h4>Ингредиенты:</h4>
            <div id="ingredientsList"></div>
            <button class="mode-btn" style="width: 100%; margin-bottom: 15px;" onclick="addIngredientRow(); saveDraftLocally();">+ Добавить ингредиент</button>

            <h4>Шаги приготовления:</h4>
            <div id="stepsList"></div>
            <button class="mode-btn" style="width: 100%; margin-bottom: 15px;" onclick="addStepRow(); saveDraftLocally();">+ Добавить шаг</button>

            <div class="actions-row">
                <button class="action-btn" onclick="saveRecipe()" style="flex: 2; margin-bottom: 0;">Сохранить в базу</button>
                <button class="mode-btn" onclick="closeConstructor()" style="flex: 1; margin-bottom: 0;">Отмена</button>
            </div>
        </div>
    </div>

    <!-- Список рецептов -->
    <div id="recipesContainer">
        <p style="text-align: center; color: var(--hint-color);">Загрузка рецептов из Supabase...</p>
    </div>

<script>
    const SUPABASE_URL = 'https://fxvporgpgpxudzlbauty.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_kcUT9hJ_k8e-2sj0j8BbAA_QvG8Wc-p';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentMode = 'simple';
    let editingRecipeId = null;
    let recipes = [];

    const tg = window.Telegram.WebApp;
    tg.expand();
    const userId = tg.initDataUnsafe?.user?.id ? String(tg.initDataUnsafe.user.id) : 'demo_chef_123';

    window.addEventListener('DOMContentLoaded', () => {
        loadRecipesFromSupabase();
    });

    function setMode(mode) {
        currentMode = mode;
        document.getElementById('btnSimple').classList.toggle('active', mode === 'simple');
        document.getElementById('btnPro').classList.toggle('active', mode === 'pro');
        
        const container = document.getElementById('portionsContainer');
        const currentVal = document.getElementById('recipePortionsRange')?.value || document.getElementById('recipePortionsInput')?.value || 4;
        
        if (mode === 'pro') {
            container.innerHTML = `<input type="number" id="recipePortionsInput" value="${currentVal}" min="1" max="10000" placeholder="Количество порций" oninput="saveDraftLocally()" style="margin-bottom:0;">`;
            document.getElementById('portionsLabel').style.display = 'none';
        } else {
            container.innerHTML = `<input type="range" id="recipePortionsRange" min="1" max="20" value="${currentVal > 20 ? 20 : currentVal}" oninput="updatePortionsVal(this.value); saveDraftLocally()" style="margin-bottom:0;">`;
            document.getElementById('portionsLabel').style.display = 'block';
            document.getElementById('portionsValue').innerText = currentVal > 20 ? 20 : currentVal;
        }
        rebuildIngredientsListUI();
    }

    function updatePortionsVal(val) {
        document.getElementById('portionsValue').innerText = val;
    }

    function getPortionsCount() {
        if (currentMode === 'pro') {
            return parseInt(document.getElementById('recipePortionsInput')?.value) || 4;
        } else {
            return parseInt(document.getElementById('recipePortionsRange')?.value) || 4;
        }
    }

    function checkTitleInput() {
        const titleVal = document.getElementById('recipeTitle').value.trim();
        document.getElementById('constructorBody').style.display = titleVal.length > 0 ? 'block' : 'none';
    }

    function openConstructor(recipe = null) {
        document.getElementById('createRecipeBtn').style.display = 'none';
        document.getElementById('categoryClassifier').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'block';
        
        document.getElementById('ingredientsList').innerHTML = '';
        document.getElementById('stepsList').innerHTML = '';

        if (recipe) {
            editingRecipeId = recipe.id;
            document.getElementById('constructorTitle').textContent = '✏️ Редактирование техкарты';
            document.getElementById('recipeTitle').value = recipe.title || '';
            checkTitleInput();
            document.getElementById('recipeCategory').value = recipe.category || '';
            
            const portions = recipe.base_portions || 4;
            if (currentMode === 'pro') {
                const inp = document.getElementById('recipePortionsInput');
                if (inp) inp.value = portions;
            } else {
                const range = document.getElementById('recipePortionsRange');
                if (range) range.value = portions <= 20 ? portions : 20;
                updatePortionsVal(portions <= 20 ? portions : 20);
            }

            (recipe.ingredients || []).forEach(ing => addIngredientRow(ing));
            (recipe.steps || []).forEach(stp => addStepRow(stp));
        } else {
            editingRecipeId = null;
            document.getElementById('constructorTitle').textContent = '➕ Новая техкарта';
            document.getElementById('recipeTitle').value = '';
            checkTitleInput();
            document.getElementById('recipeCategory').selectedIndex = 0;
            addIngredientRow();
            addStepRow();
        }
    }

    function closeConstructor() {
        document.getElementById('adminPanel').style.display = 'none';
        document.getElementById('createRecipeBtn').style.display = 'block';
        document.getElementById('categoryClassifier').style.display = 'flex';
        editingRecipeId = null;
        localStorage.removeItem('chef_recipe_draft');
    }

    function addIngredientRow(data = {}) {
        const container = document.getElementById('ingredientsList');
        const div = document.createElement('div');
        div.className = 'ingredient-row';
        
        let proHtml = '';
        if (currentMode === 'pro') {
            const gross = data.gross || '';
            const net = data.net || '';
            proHtml = `
                <div class="pro-fields">
                    <input type="number" placeholder="Брутто (г)" value="${gross}" oninput="saveDraftLocally()" class="ing-gross">
                    <input type="number" placeholder="Нетто (г)" value="${net}" oninput="saveDraftLocally()" class="ing-net">
                </div>
            `;
        } else {
            proHtml = `<input type="number" placeholder="Вес (г)" value="${data.gross || data.weight || ''}" oninput="saveDraftLocally()" class="ing-weight">`;
        }

        div.innerHTML = `
            <input type="text" placeholder="Название продукта" value="${data.name || ''}" oninput="saveDraftLocally()" class="ing-name">
            ${proHtml}
            <button type="button" class="mode-btn" style="color: #ff5252; border-color: #ff5252; padding: 4px;" onclick="this.parentElement.remove(); saveDraftLocally();">Удалить ингредиент</button>
        `;
        container.appendChild(div);
    }

    function rebuildIngredientsListUI() {
        const rows = document.querySelectorAll('.ingredient-row');
        const currentData = [];
        rows.forEach(row => {
            currentData.push({
                name: row.querySelector('.ing-name')?.value || '',
                gross: row.querySelector('.ing-gross')?.value || row.querySelector('.ing-weight')?.value || '',
                net: row.querySelector('.ing-net')?.value || ''
            });
        });
        document.getElementById('ingredientsList').innerHTML = '';
        currentData.forEach(d => addIngredientRow(d));
    }

    function addStepRow(data = {}) {
        const container = document.getElementById('stepsList');
        const div = document.createElement('div');
        div.className = 'step-row';
        
        const methods = ['бланшировать', 'варить', 'тушить', 'пар', 'жар/пар', 'жар', 'жарить', 'колеровать', 'гриль'];
        const currentMethod = typeof data === 'object' ? data.method : 'тушить';
        let optionsHtml = methods.map(m => `<option value="${m}" ${currentMethod === m ? 'selected' : ''}>${m}</option>`).join('');

        const descText = typeof data === 'object' ? (data.desc || '') : (typeof data === 'string' ? data : '');

        div.innerHTML = `
            <textarea placeholder="Описание шага..." rows="2" oninput="saveDraftLocally()" class="step-desc">${descText}</textarea>
            <label style="font-size: 11px; color: var(--hint-color); margin-top: 2px;">Метод приготовления:</label>
            <select class="step-method" onchange="saveDraftLocally()">
                ${optionsHtml}
            </select>
            <button type="button" class="mode-btn" style="color: #ff5252; border-color: #ff5252; padding: 4px;" onclick="this.parentElement.remove(); saveDraftLocally();">Удалить шаг</button>
        `;
        container.appendChild(div);
    }

    function saveDraftLocally() {
        const draft = {
            title: document.getElementById('recipeTitle')?.value || '',
            category: document.getElementById('recipeCategory')?.value || '',
            portions: getPortionsCount(),
            ingredients: getIngredientsFromDOM(),
            steps: getStepsFromDOM()
        };
        localStorage.setItem('chef_recipe_draft', JSON.stringify(draft));
    }

    function getIngredientsFromDOM() {
        const ingredients = [];
        document.querySelectorAll('.ingredient-row').forEach(row => {
            const name = row.querySelector('.ing-name')?.value;
            if (!name) return;
            if (currentMode === 'pro') {
                ingredients.push({
                    name,
                    gross: parseFloat(row.querySelector('.ing-gross')?.value) || 0,
                    net: parseFloat(row.querySelector('.ing-net')?.value) || 0,
                    unit: 'г'
                });
            } else {
                const w = parseFloat(row.querySelector('.ing-weight')?.value) || 0;
                ingredients.push({
                    name,
                    gross: w,
                    net: w,
                    unit: 'г'
                });
            }
        });
        return ingredients;
    }

    function getStepsFromDOM() {
        const steps = [];
        document.querySelectorAll('.step-row').forEach(row => {
            steps.push({
                desc: row.querySelector('.step-desc')?.value || '',
                method: row.querySelector('.step-method')?.value || 'тушить'
            });
        });
        return steps;
    }

    async function loadRecipesFromSupabase() {
        try {
            const { data: recipesData, error: recError } = await supabaseClient
                .from('recipes')
                .select('*')
                .order('created_at', { ascending: false });

            if (recError) throw recError;

            const { data: ingredientsData, error: ingError } = await supabaseClient
                .from('ingredients')
                .select('*');

            if (ingError) throw ingError;

            recipes = (recipesData || []).map(recipe => {
                recipe.ingredients = (ingredientsData || []).filter(i => i.recipe_id === recipe.id);
                if (typeof recipe.steps === 'string') {
                    try { recipe.steps = JSON.parse(recipe.steps); } catch(e) { recipe.steps = []; }
                }
                return recipe;
            });

            renderRecipes();
        } catch (err) {
            console.error('Ошибка загрузки:', err);
            document.getElementById('recipesContainer').innerHTML = `<p style="text-align: center; color: #ff5252;">Ошибка загрузки базы: ${err.message}</p>`;
        }
    }

    async function saveRecipe() {
        const title = document.getElementById('recipeTitle').value.trim();
        const category = document.getElementById('recipeCategory').value;
        const base_portions = getPortionsCount();
        const ingredients = getIngredientsFromDOM();
        const steps = getStepsFromDOM();

        if (!title) {
            alert('Введите название блюда!');
            return;
        }
        if (!category) {
            alert('Выберите категорию!');
            return;
        }

        try {
            if (editingRecipeId) {
                // Обновление
                const { error: updateErr } = await supabaseClient
                    .from('recipes')
                    .update({ title, category, base_portions, steps: JSON.stringify(steps) })
                    .eq('id', editingRecipeId);

                if (updateErr) throw updateErr;

                await supabaseClient.from('ingredients').delete().eq('recipe_id', editingRecipeId);

                if (ingredients.length > 0) {
                    const ingRows = ingredients.map(ing => ({
                        recipe_id: editingRecipeId,
                        name: ing.name,
                        gross: ing.gross,
                        net: ing.net,
                        unit: ing.unit
                    }));
                    const { error: insIngErr } = await supabaseClient.from('ingredients').insert(ingRows);
                    if (insIngErr) throw insIngErr;
                }
            } else {
                // Создание нового
                const { data: recipeData, error: recipeError } = await supabaseClient
                    .from('recipes')
                    .insert([{ user_id: userId, title, category, base_portions, steps: JSON.stringify(steps) }])
                    .select()
                    .single();

                if (recipeError) throw recipeError;

                const recipeId = recipeData.id;
                if (ingredients.length > 0) {
                    const ingRows = ingredients.map(ing => ({
                        recipe_id: recipeId,
                        name: ing.name,
                        gross: ing.gross,
                        net: ing.net,
                        unit: ing.unit
                    }));
                    const { error: ingError } = await supabaseClient.from('ingredients').insert(ingRows);
                    if (ingError) throw ingError;
                }
            }

            alert('Техкарта успешно сохранена в базу!');
            closeConstructor();
            await loadRecipesFromSupabase();
        } catch (err) {
            alert('Ошибка сохранения: ' + err.message);
            console.error(err);
        }
    }

    async function deleteRecipe(id) {
        if (!confirm('Точно удалить этот рецепт?')) return;
        try {
            await supabaseClient.from('ingredients').delete().eq('recipe_id', id);
            const { error } = await supabaseClient.from('recipes').delete().eq('id', id);
            if (error) throw error;
            await loadRecipesFromSupabase();
        } catch (err) {
            alert('Ошибка удаления: ' + err.message);
        }
    }

    let activeFilter = 'Все';
    function filterCategory(cat) {
        activeFilter = cat;
        document.querySelectorAll('.category-chip').forEach(chip => {
            chip.classList.toggle('active', chip.textContent.includes(cat) || (cat === 'Все' && chip.textContent === 'Все'));
        });
        renderRecipes();
    }

    function renderRecipes() {
        const container = document.getElementById('recipesContainer');
        container.innerHTML = '';

        let filtered = recipes;
        if (activeFilter !== 'Все') {
            filtered = recipes.filter(r => r.category === activeFilter);
        }

        if (filtered.length === 0) {
            container.innerHTML = `<p style="text-align: center; color: var(--hint-color);">Техкарт пока нет в категории «${activeFilter}».</p>`;
            return;
        }

        filtered.forEach(recipe => {
            const card = document.createElement('div');
            card.className = 'recipe-card';
            
            let ingListHtml = (recipe.ingredients || []).map(i => `<li>${i.name} — ${i.gross}г</li>`).join('');
            let stepsListHtml = (recipe.steps || []).map((s, idx) => `<li>Шаг ${idx+1}: ${s.desc} <br><span style="color:var(--hint-color);">Метод: ${s.method}</span></li>`).join('');

            card.innerHTML = `
                <h3 style="margin-bottom: 5px;">${recipe.title}</h3>
                <div style="font-size: 12px; color: var(--hint-color); margin-bottom: 8px;">Категория: ${recipe.category} | Порций: ${recipe.base_portions || 4}</div>
                <div style="font-size: 13px; margin-bottom: 6px;"><b>Ингредиенты:</b><ul>${ingListHtml}</ul></div>
                <div style="font-size: 13px; margin-bottom: 12px;"><b>Шаги:</b><ol>${stepsListHtml}</ol></div>
                <div style="display: flex; gap: 8px;">
                    <button class="mode-btn" style="flex: 2;" onclick='editRecipe("${recipe.id}")'>Редактировать</button>
                    <button class="mode-btn" style="flex: 1; color: #ff5252; border-color: #ff5252;" onclick='deleteRecipe("${recipe.id}")'>Удалить</button>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function editRecipe(id) {
        const recipe = recipes.find(r => r.id == id);
        if (recipe) openConstructor(recipe);
    }
</script>
</body>
</html>
