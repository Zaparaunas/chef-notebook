<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Блокнот Шефа</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --tg-bg: var(--tg-theme-bg-color, #0f1215);
            --tg-card-bg: var(--tg-theme-secondary-bg-color, #181d23);
            --tg-text: var(--tg-theme-text-color, #f5f5f7);
            --tg-hint: var(--tg-theme-hint-color, #8e959d);
            --tg-button: var(--tg-theme-button-color, #2ea6ff);
            --tg-button-text: var(--tg-theme-button-text-color, #ffffff);
            --tg-border: rgba(255, 255, 255, 0.08);
        }

        body {
            background-color: var(--tg-bg);
            color: var(--tg-text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 12px;
            -webkit-font-smoothing: antialiased;
        }

        .app-container {
            max-width: 480px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 4px 16px 4px;
            border-bottom: 1px solid var(--tg-border);
            margin-bottom: 14px;
        }

        .header-title {
            font-size: 17px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .mode-btn {
            background: var(--tg-card-bg);
            border: 1px solid var(--tg-border);
            color: var(--tg-text);
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .recipe-card {
            background: var(--tg-card-bg);
            border-radius: 16px;
            padding: 16px;
            border: 1px solid var(--tg-border);
            margin-bottom: 14px;
        }

        .recipe-name {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .portions-control {
            margin-bottom: 16px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--tg-border);
        }

        .portions-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 15px;
            font-weight: 600;
        }

        .portions-slider {
            width: 100%;
            accent-color: var(--tg-button);
            cursor: pointer;
        }

        .section-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--tg-hint);
            margin: 16px 4px 8px 4px;
            font-weight: 700;
        }

        .ingredients-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .ingredient-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 10px;
            border: 1px solid var(--tg-border);
            cursor: pointer;
        }

        .ingredient-item.checked {
            opacity: 0.4;
            text-decoration: line-through;
        }

        .ing-weight {
            font-weight: 700;
            color: var(--tg-button);
        }

        .pro-only {
            display: none;
            font-size: 11px;
            color: var(--tg-hint);
            margin-top: 2px;
        }

        body.pro-mode .pro-only {
            display: block;
        }

        .admin-panel {
            background: var(--tg-card-bg);
            border: 1px solid var(--tg-border);
            padding: 16px;
            border-radius: 16px;
            margin-bottom: 14px;
        }
        .admin-panel input, .admin-panel textarea {
            width: 100%;
            padding: 8px;
            margin-bottom: 8px;
            background: var(--tg-bg);
            border: 1px solid var(--tg-border);
            color: var(--tg-text);
            border-radius: 8px;
            box-sizing: border-box;
        }
        .action-btn {
            background: var(--tg-button);
            color: var(--tg-button-text);
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">
            <div class="header-title">
                <span>📜</span> Блокнот Шефа
            </div>
            <div style="display: flex; gap: 6px;">
                <button class="mode-btn" onclick="toggleAdminPanel()">➕ Рецепт</button>
                <button class="mode-btn" id="modeToggleBtn" onclick="toggleMode()">Дом 🏡</button>
            </div>
        </div>

        <div class="admin-panel" id="adminPanel" style="display: none;">
            <div style="font-weight: 700; margin-bottom: 8px;">Добавить новый рецепт</div>
            <input type="text" id="newTitle" placeholder="Название блюда">
            <input type="text" id="newCategory" placeholder="Категория (Горячее, Супы...)">
            <input type="number" id="newPortions" placeholder="Базовые порции" value="4">
            <textarea id="newSteps" placeholder="Шаги приготовления..."></textarea>
            <button class="action-btn" onclick="addNewRecipe()">Сохранить в Supabase</button>
        </div>

        <div id="recipesContainer">
            <div class="recipe-card">
                <div class="recipe-name">Загрузка рецептов из базы...</div>
            </div>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        // Твои реальные данные подключения
        const SUPABASE_URL = "https://fxvporgpgpxudzlbauty.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_kcUT9hJ_k8e-2sj0j8BbAA_QvG8Wc-p";
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let isProMode = false;

        function toggleMode() {
            isProMode = !isProMode;
            document.body.classList.toggle('pro-mode', isProMode);
            const btn = document.getElementById('modeToggleBtn');
            btn.innerText = isProMode ? "PRO 🔪" : "Дом 🏡";
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
        }

        function toggleAdminPanel() {
            const panel = document.getElementById('adminPanel');
            panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
        }

        async function loadRecipes() {
            const container = document.getElementById('recipesContainer');
            
            let { data: recipes, error } = await supabaseClient
                .from('recipes')
                .select('*');

            if (error || !recipes || recipes.length === 0) {
                container.innerHTML = `
                    <div class="recipe-card">
                        <div class="recipe-name">Оссобуко по-милански (Демо)</div>
                        <div class="portions-control">
                            <div class="portions-info">
                                <span>Порций:</span>
                                <span id="val-demo" style="color: var(--tg-button);">4</span>
                            </div>
                            <input type="range" min="1" max="20" value="4" class="portions-slider" oninput="updatePortions(this, 'ing-demo', 4)">
                        </div>
                        <div class="section-title">Ингредиенты:</div>
                        <div class="ingredients-list" id="ing-demo">
                            <div class="ingredient-item" onclick="this.classList.toggle('checked')">
                                <span>Говяжья голяшка</span>
                                <span class="ing-weight" data-base="500" data-unit="г">500 г</span>
                            </div>
                        </div>
                    </div>`;
                return;
            }

            container.innerHTML = '';
            recipes.forEach((recipe, index) => {
                container.innerHTML += `
                    <div class="recipe-card">
                        <div class="recipe-name">${recipe.title}</div>
                        <div class="portions-control">
                            <div class="portions-info">
                                <span>Порций:</span>
                                <span id="val-${index}" style="color: var(--tg-button);">${recipe.base_portions || 4}</span>
                            </div>
                            <input type="range" min="1" max="30" value="${recipe.base_portions || 4}" class="portions-slider" oninput="updatePortions(this, 'ing-${index}', ${recipe.base_portions || 4}, '${recipe.id}')">
                        </div>
                        <div class="section-title">Ингредиенты:</div>
                        <div class="ingredients-list" id="ing-${index}">
                            <div class="text-sm text-tg-hint">Загрузка ингредиентов...</div>
                        </div>
                        <div class="section-title" style="margin-top: 12px;">Шаги:</div>
                        <div style="font-size: 14px; color: var(--tg-hint);">${recipe.steps || 'Нет описания'}</div>
                    </div>`;
                loadIngredientsForRecipe(recipe.id, `ing-${index}`, recipe.base_portions || 4);
            });
        }

        async function loadIngredientsForRecipe(recipeId, containerId, basePortions) {
            const container = document.getElementById(containerId);
            let { data: ingredients, error } = await supabaseClient
                .from('ingredients')
                .select('*')
                .eq('recipe_id', recipeId);

            if (error || !ingredients || ingredients.length === 0) {
                container.innerHTML = `<div class="text-sm text-tg-hint">Нет ингредиентов в базе. Добавь их в Supabase.</div>`;
                return;
            }

            container.innerHTML = '';
            ingredients.forEach(ing => {
                container.innerHTML += `
                    <div class="ingredient-item" onclick="this.classList.toggle('checked')">
                        <div>
                            <div style="font-size: 14px; font-weight: 500;">• ${ing.name}</div>
                            <div class="pro-only">⚖️ Брутто: ${ing.gross}г | Нетто: ${ing.net}г (-${ing.loss_percent || 0}%)</div>
                        </div>
                        <div class="ing-weight" data-base="${ing.net || ing.gross || 0}" data-unit="${ing.unit || 'г'}">${ing.net || ing.gross || 0} ${ing.unit || 'г'}</div>
                    </div>`;
            });
        }

        function updatePortions(slider, containerId, basePortions) {
            const val = slider.value;
            // Находим числовой элемент порций для конкретной карточки
            const sliderId = slider.id || '';
            const factor = val / basePortions;
            
            const container = document.getElementById(containerId);
            if (!container) return;
            const items = container.getElementsByClassName('ingredient-item');
            
            Array.from(items).forEach(item => {
                const weightSpan = item.querySelector('.ing-weight');
                if (!weightSpan) return;
                const baseVal = parseFloat(weightSpan.getAttribute('data-base'));
                const unit = weightSpan.getAttribute('data-unit');
                const calculated = Math.round(baseVal * factor * 10) / 10;
                weightSpan.innerText = `${calculated} ${unit}`;
            });
        }

        async function addNewRecipe() {
            const title = document.getElementById('newTitle').value;
            const category = document.getElementById('newCategory').value;
            const base_portions = parseInt(document.getElementById('newPortions').value) || 4;
            const steps = document.getElementById('newSteps').value;
            
            if (!title) {
                alert('Введите название рецепта!');
                return;
            }

            const { data, error } = await supabaseClient
                .from('recipes')
                .insert([{ title, category, base_portions, steps, user_id: tg.initDataUnsafe?.user?.id || 'web_user' }]);

            if (error) {
                alert('Ошибка сохранения: ' + error.message);
            } else {
                alert('Рецепт успешно сохранен в Supabase!');
                toggleAdminPanel();
                loadRecipes();
            }
        }

        loadRecipes();
    </script>
</body>
</html>
