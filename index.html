<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Блокнот Шефа</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #ffffff);
            --text-color: var(--tg-theme-text-color, #000000);
            --hint-color: var(--tg-theme-hint-color, #999999);
            --button-color: var(--tg-theme-button-color, #2481cc);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
            --secondary-bg-color: var(--tg-theme-secondary-bg-color, #f1f1f1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        h2, h3, h4 { margin: 0 0 10px 0; }

        button {
            background-color: var(--button-color);
            color: var(--button-text-color);
            border: none;
            border-radius: 8px;
            padding: 10px 16px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        button.secondary {
            background-color: var(--secondary-bg-color);
            color: var(--text-color);
        }

        button.danger {
            background-color: #ff5252;
            color: #ffffff;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid var(--hint-color);
            border-radius: 8px;
            background: var(--bg-color);
            color: var(--text-color);
            box-sizing: border-box;
        }

        .card {
            background: var(--secondary-bg-color);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .card:active {
            opacity: 0.7;
        }

        .mode-switch {
            display: flex;
            background: var(--secondary-bg-color);
            border-radius: 8px;
            padding: 2px;
        }

        .mode-btn {
            background: transparent;
            color: var(--text-color);
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
        }

        .mode-btn.active {
            background: var(--button-color);
            color: var(--button-text-color);
        }

        .ingredient-item.checked span {
            text-decoration: line-through;
            opacity: 0.5;
        }

        @media print {
            body * {
                visibility: hidden;
            }
            #recipeDetailScreen, #recipeDetailScreen * {
                visibility: visible;
            }
            #recipeDetailScreen {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                margin: 0;
                padding: 0;
            }
            .no-print {
                display: none !important;
            }
            .card {
                background: white !important;
                color: black !important;
                box-shadow: none !important;
                border: none !important;
            }
            body {
                background: white !important;
                color: black !important;
            }
        }
    </style>
</head>
<body>

    <!-- Шапка приложения -->
    <div class="header no-print">
        <h2>Блокнот Шефа</h2>
        <div class="mode-switch">
            <button class="mode-btn active" id="btnSimple" onclick="setMode('simple')">Дом</button>
            <button class="mode-btn" id="btnPro" onclick="setMode('pro')">Pro</button>
        </div>
    </div>

    <!-- Главный экран: Кнопки управления и рубрикатор -->
    <div id="mainScreen" class="no-print">
        <div style="margin-bottom: 16px; display: flex; gap: 10px;">
            <button id="btnOpenConstructor" onclick="openConstructor()" style="flex: 1;">+ Новая техкарта</button>
            <button class="secondary" onclick="loadRecipes()">🔄 Обновить</button>
        </div>

        <!-- Рубрикатор / Список рецептов -->
        <div id="recipesContainer">
            <p style="color: var(--hint-color); text-align: center;">Загрузка рецептов...</p>
        </div>
    </div>

    <!-- Экран детального просмотра рецепта -->
    <div id="recipeDetailScreen" style="display: none;">
        <div style="display: flex; gap: 10px; margin-bottom: 14px;" class="no-print">
            <button class="secondary" onclick="closeRecipeDetail()" style="flex: 1;">← Назад</button>
            <button onclick="window.print()" style="flex: 1;">Печать / PDF</button>
        </div>
        <div class="card" style="cursor: default;" id="detailContent"></div>
    </div>

    <!-- Конструктор / Редактор техкарты -->
    <div id="recipeConstructor" class="card no-print" style="display: none; cursor: default;">
        <h3 id="constructorTitle" style="font-size: 18px; border-bottom: 2px solid var(--button-color); padding-bottom: 6px; margin-bottom: 14px;">Создание техкарты</h3>
        
        <input type="hidden" id="editingRecipeId" value="">

        <!-- Название блюда (выделенное) -->
        <div style="margin-bottom: 14px;">
            <label style="font-size: 13px; font-weight: 700; color: var(--button-color);">Название блюда *</label>
            <input type="text" id="recipeTitle" placeholder="Например, Оссобуко по-милански" oninput="handleTitleInput(this.value)" style="font-size: 16px; font-weight: 600; border: 2px solid var(--button-color);">
        </div>

        <!-- Динамическое тело формы (появляется только после ввода названия) -->
        <div id="dynamicFormBody" style="display: none;">
            <!-- Категории от мяса к напиткам + другое -->
            <div style="margin-bottom: 14px;">
                <label style="font-size: 12px; color: var(--hint-color);">Категория</label>
                <select id="recipeCategory">
                    <option value="" disabled selected>Выберите категорию...</option>
                    <option value="Мясо и птица">Мясо и птица</option>
                    <option value="Рыба и морепродукты">Рыба и морепродукты</option>
                    <option value="Овощи и грибы">Овощи и грибы</option>
                    <option value="Крупы, макароны и бобовые">Крупы, макароны и бобовые</option>
                    <option value="Супы">Супы</option>
                    <option value="Холодные блюда и закуски">Холодные блюда и закуски</option>
                    <option value="Соусы, маринады и заправки">Соусы, маринады и заправки</option>
                    <option value="Полуфабрикаты и заготовки">Полуфабрикаты и заготовки</option>
                    <option value="Выпечка и десерты">Выпечка и десерты</option>
                    <option value="Напитки">Напитки</option>
                    <option value="Другое">Другое</option>
                </select>
            </div>

            <!-- Порции: ползунок до 20 + ручной ввод с исчезновением ползунка при ручном вводе -->
            <div style="margin-bottom: 14px;">
                <label style="font-size: 12px; color: var(--hint-color);">Количество базовых порций</label>
                <div style="display: flex; align-items: center; gap: 10px; margin-top: 4px;">
                    <input type="range" id="recipePortionsRange" min="1" max="20" value="4" oninput="syncPortions('range', this.value)" style="flex: 1; margin: 0;">
                    <input type="number" id="recipePortionsInput" min="1" max="1000" value="4" oninput="syncPortions('input', this.value)" style="width: 70px; margin: 0; text-align: center; font-weight: 600;">
                </div>
            </div>

            <!-- Ингредиенты -->
            <h4 style="margin: 16px 0 8px 0; font-size: 14px;">Ингредиенты:</h4>
            <div id="ingredientsList" style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px;"></div>
            <button class="secondary" onclick="addIngredientRow()" style="width: 100%; margin-bottom: 16px;">+ Добавить ингредиент</button>

            <!-- Шаги приготовления -->
            <h4 style="margin: 16px 0 8px 0; font-size: 14px;">Шаги приготовления:</h4>
            <div id="stepsList" style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 10px;"></div>
            <button class="secondary" onclick="addStepRow()" style="width: 100%; margin-bottom: 20px;">+ Добавить шаг</button>

            <!-- Кнопки сохранения / отмены -->
            <div style="display: flex; gap: 10px;">
                <button class="secondary" onclick="closeConstructor()" style="flex: 1;">Отмена</button>
                <button onclick="saveRecipeToDB()" style="flex: 2;">Сохранить техкарту</button>
            </div>
        </div>
    </div>

    <script>
        let tg = window.Telegram?.WebApp;
        if (tg) { tg.expand(); }

        const userId = tg?.initDataUnsafe?.user?.id ? String(tg.initDataUnsafe.user.id) : 'test_user_chef';
        const SUPABASE_URL = 'https://fxvporgpgpxudzlbauty.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ4dnBvcmdncGd4dWR6bGJhdXR5Iiwicm9sZSI6ImFub24iLCJpYXQiOjM3OTU5MjA5N30.placeholder_key_fix';
        
        let supabaseClient = null;
        try {
            if (window.supabase) {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }
        } catch (e) {
            console.error('Supabase init error:', e);
        }

        let currentMode = 'simple';
        let recipes = [];

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('btnSimple').classList.toggle('active', mode === 'simple');
            document.getElementById('btnPro').classList.toggle('active', mode === 'pro');
            renderRecipesList();
        }

        function handleTitleInput(val) {
            const body = document.getElementById('dynamicFormBody');
            body.style.display = val.trim().length > 0 ? 'block' : 'none';
        }

        function syncPortions(source, val) {
            const range = document.getElementById('recipePortionsRange');
            const input = document.getElementById('recipePortionsInput');
            
            if (source === 'range') {
                input.value = val;
                range.style.display = 'block';
            } else {
                let num = parseInt(val) || 1;
                input.value = num;
                if (num > 20) {
                    range.style.display = 'none';
                } else {
                    range.style.display = 'block';
                    range.value = num;
                }
            }
        }

        function openConstructor(recipeToEdit = null) {
            const constructor = document.getElementById('recipeConstructor');
            constructor.style.display = 'block';
            document.getElementById('btnOpenConstructor').style.display = 'none'; // Скрываем кнопку создания на время редактирования/создания
            document.getElementById('ingredientsList').innerHTML = '';
            document.getElementById('stepsList').innerHTML = '';

            if (recipeToEdit) {
                document.getElementById('constructorTitle').innerText = 'Редактирование техкарты';
                document.getElementById('editingRecipeId').value = recipeToEdit.id;
                document.getElementById('recipeTitle').value = recipeToEdit.title || '';
                handleTitleInput(recipeToEdit.title || '');
                document.getElementById('recipeCategory').value = recipeToEdit.category || '';
                
                let p = recipeToEdit.base_portions || 4;
                document.getElementById('recipePortionsInput').value = p;
                syncPortions('input', p);

                (recipeToEdit.ingredients || []).forEach(ing => {
                    addIngredientRow(ing.name, ing.gross, ing.net, ing.unit);
                });

                (recipeToEdit.steps || []).forEach(step => {
                    addStepRow(step.text, step.method);
                });
            } else {
                document.getElementById('constructorTitle').innerText = 'Создание техкарты';
                document.getElementById('editingRecipeId').value = '';
                document.getElementById('recipeTitle').value = '';
                handleTitleInput('');
                document.getElementById('recipeCategory').value = '';
                document.getElementById('recipePortionsInput').value = 4;
                syncPortions('input', 4);
                addIngredientRow('Мясо', 1000, 800, 'г');
                addStepRow('Подготовить продукты.', 'колеровать');
            }
        }

        function closeConstructor() {
            document.getElementById('recipeConstructor').style.display = 'none';
            document.getElementById('btnOpenConstructor').style.display = 'block';
        }

        function addIngredientRow(name = '', gross = '', net = '', unit = 'г') {
            const container = document.getElementById('ingredientsList');
            const row = document.createElement('div');
            row.style.cssText = 'display: flex; gap: 6px; align-items: center; background: var(--bg-color); padding: 8px; border-radius: 8px; border: 1px solid var(--hint-color);';
            row.innerHTML = `
                <div style="flex: 2;">
                    <input type="text" placeholder="Продукт" value="${name}" class="ing-name" style="margin: 0; margin-bottom: 4px;">
                    <div style="display: flex; gap: 4px;">
                        <input type="number" placeholder="Брутто" value="${gross}" class="ing-gross" style="margin: 0;" title="Вес брутто">
                        <input type="number" placeholder="Нетто" value="${net}" class="ing-net" style="margin: 0;" title="Вес нетто">
                    </div>
                </div>
                <div style="flex: 1;">
                    <select class="ing-unit" style="margin: 0; margin-bottom: 4px;">
                        <option value="г" ${unit==='г'?'selected':''}>г</option>
                        <option value="кг" ${unit==='кг'?'selected':''}>кг</option>
                        <option value="мл" ${unit==='мл'?'selected':''}>мл</option>
                        <option value="л" ${unit==='л'?'selected':''}>л</option>
                        <option value="шт" ${unit==='шт'?'selected':''}>шт</option>
                    </select>
                </div>
                <button type="button" onclick="this.parentElement.remove()" style="background: none; border: none; color: #ff5252; cursor: pointer; font-weight: bold; padding: 5px;">✕</button>
            `;
            container.appendChild(row);
        }

        function addStepRow(stepText = '', method = 'колеровать') {
            const container = document.getElementById('stepsList');
            const methods = ['жар', 'пар', 'жар/пар', 'варить', 'жарить', 'бланшировать', 'тушить', 'колеровать', 'гриль'];
            let optionsHtml = methods.map(m => `<option value="${m}" ${m === method ? 'selected' : ''}>${m}</option>`).join('');

            const row = document.createElement('div');
            row.className = 'step-row';
            row.style.cssText = 'display: flex; flex-direction: column; gap: 6px; padding: 10px; background: var(--bg-color); border-radius: 8px; border: 1px solid var(--hint-color);';
            row.innerHTML = `
                <textarea placeholder="Описание шага приготовления..." class="step-desc" style="width: 100%; margin: 0; padding: 6px; resize: vertical;" rows="2">${stepText}</textarea>
                <div style="display: flex; gap: 8px; align-items: center;">
                    <select style="flex: 1; margin: 0; padding: 6px;" class="step-method">
                        ${optionsHtml}
                    </select>
                    <button type="button" onclick="this.closest('.step-row').remove()" style="background: none; border: none; color: #ff5252; cursor: pointer; font-weight: bold;">✕</button>
                </div>
            `;
            container.appendChild(row);
        }

        async function loadRecipes() {
            const container = document.getElementById('recipesContainer');
            container.innerHTML = '<p style="color: var(--hint-color); text-align: center;">Загрузка...</p>';

            if (!supabaseClient) {
                loadFallback();
                return;
            }

            try {
                const { data, error } = await supabaseClient
                    .from('recipes')
                    .select('*')
                    .eq('user_id', userId);

                if (error) throw error;
                recipes = data || [];
                renderRecipesList();
            } catch (err) {
                console.error('Ошибка загрузки:', err);
                loadFallback();
            }
        }

        function loadFallback() {
            const local = localStorage.getItem('chef_recipes_cache');
            if (local) {
                recipes = JSON.parse(local);
            } else {
                recipes = [];
            }
            renderRecipesList();
        }

        function renderRecipesList() {
            const container = document.getElementById('recipesContainer');
            if (recipes.length === 0) {
                container.innerHTML = '<p style="color: var(--hint-color); text-align: center;">Список рецептов пуст</p>';
                return;
            }

            // Группируем по категориям
            const categoriesOrder = [
                "Мясо и птица", "Рыба и морепродукты", "Овощи и грибы", 
                "Крупы, макароны и бобовые", "Супы", "Холодные блюда и закуски", 
                "Соусы, маринады и заправки", "Полуфабрикаты и заготовки", 
                "Выпечка и десерты", "Напитки", "Другое"
            ];

            let html = '';
            categoriesOrder.forEach(cat => {
                const catRecipes = recipes.filter(r => (r.category || 'Другое') === cat);
                if (catRecipes.length > 0) {
                    html += `<h4 style="margin: 14px 0 6px 0; color: var(--button-color);">${cat}</h4>`;
                    catRecipes.forEach((r, index) => {
                        let realId = r.id || index;
                        html += `
                            <div class="card" onclick="openRecipeDetail('${realId}')">
                                <h3 style="margin-bottom: 4px;">${r.title}</h3>
                                <div style="font-size: 12px; color: var(--hint-color);">Порций: ${r.base_portions || 4}</div>
                            </div>
                        `;
                    });
                }
            });

            container.innerHTML = html;
        }

        function openRecipeDetail(recipeId) {
            const recipe = recipes.find(r => String(r.id) === String(recipeId)) || recipes[recipeId];
            if (!recipe) return;

            document.getElementById('mainScreen').style.display = 'none';
            document.getElementById('recipeDetailScreen').style.display = 'block';

            const basePortions = recipe.base_portions || 4;

            let totalGross = 0;
            let totalNet = 0;

            let ingredientsHtml = (recipe.ingredients || []).map(ing => {
                let g = parseFloat(ing.gross) || 0;
                let n = parseFloat(ing.net) || g;
                totalGross += g;
                totalNet += n;
                let lossPct = g > 0 ? Math.round(((g - n) / g) * 100) : 0;

                if (currentMode === 'pro') {
                    return `
                        <div style="display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px dashed var(--hint-color); font-size: 13px;">
                            <span>${ing.name}</span>
                            <div>
                                <span style="color: var(--hint-color);">Брутто: <b class="ing-gross-val" data-base="${g}">${g}</b>${ing.unit}</span> | 
                                Нетто: <b class="ing-net-val" data-base="${n}">${n}</b>${ing.unit} 
                                <span style="font-size: 11px; color: #ff5252;">(-${lossPct}%)</span>
                            </div>
                        </div>
                    `;
                } else {
                    return `
                        <div class="ingredient-item" onclick="this.classList.toggle('checked')" style="display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px dashed var(--hint-color); cursor: pointer;">
                            <span>${ing.name}</span>
                            <b><span class="ing-net-val" data-base="${n}">${n}</span> ${ing.unit || 'г'}</b>
                        </div>
                    `;
                }
            }).join('');

            let stepsHtml = (recipe.steps || []).map((step, idx) => `
                <div style="margin-bottom: 10px; padding: 8px; background: var(--bg-color); border-radius: 6px;">
                    <div>${step.text || step}</div>
                    <div style="font-size: 11px; color: var(--hint-color); margin-top: 4px;">Метод: <b>${step.method || 'колеровать'}</b></div>
                </div>
            `).join('');

            let totalLossAll = totalGross > 0 ? Math.round(((totalGross - totalNet) / totalGross) * 100) : 0;
            let summaryBlock = currentMode === 'pro' ? `
                <div style="margin-top: 12px; padding: 10px; background: var(--bg-color); border-radius: 8px; font-size: 13px; border: 1px solid var(--button-color);">
                    <b>Итого по техкарте (на ${basePortions} порц.):</b><br>
                    • Общий вес Брутто: <span id="sumGross">${totalGross}</span>г<br>
                    • Общий вес Нетто: <span id="sumNet">${totalNet}</span>г<br>
                    • Средний процент потерь: <b>${totalLossAll}%</b>
                </div>
            ` : '';

            let proPortionsBlock = currentMode === 'pro' ? `
                <div style="margin: 12px 0; background: var(--bg-color); padding: 10px; border-radius: 8px;" class="no-print">
                    <label style="font-size: 12px; color: var(--hint-color);">Пересчет порций (База: <b id="currentPortionsLabel">${basePortions}</b>)</label>
                    <input type="range" min="1" max="50" value="${basePortions}" oninput="updateDetailPortions(this.value, ${basePortions})" style="width: 100%; margin-top: 6px;">
                </div>
            ` : '';

            let adminButtons = `
                <div style="display: flex; gap: 10px; margin-top: 20px;" class="no-print">
                    <button class="secondary" onclick="editRecipe('${recipe.id || recipeId}')" style="flex: 1;">Редактировать</button>
                    <button class="danger" onclick="deleteRecipe('${recipe.id || recipeId}')" style="flex: 1;">Удалить</button>
                </div>
            `;

            document.getElementById('detailContent').innerHTML = `
                <h2 style="margin-bottom: 6px;">${recipe.title}</h2>
                <div style="font-size: 12px; color: var(--hint-color); margin-bottom: 12px;">Категория: ${recipe.category}</div>
                ${proPortionsBlock}
                <h4 style="margin-top: 14px;">Ингредиенты:</h4>
                <div style="margin-bottom: 14px;">${ingredientsHtml || '<p style="color:var(--hint-color)">Нет ингредиентов</p>'}</div>
                ${summaryBlock}
                <h4 style="margin-top: 14px;">Шаги приготовления:</h4>
                <div>${stepsHtml || '<p style="color:var(--hint-color)">Нет шагов</p>'}</div>
                ${adminButtons}
            `;
        }

        function closeRecipeDetail() {
            document.getElementById('recipeDetailScreen').style.display = 'none';
            document.getElementById('mainScreen').style.display = 'block';
        }

        function updateDetailPortions(newPortions, basePortions) {
            document.getElementById('currentPortionsLabel').innerText = newPortions;
            const mult = newPortions / basePortions;
            
            let sumG = 0;
            let sumN = 0;

            document.querySelectorAll('.ing-gross-val').forEach(el => {
                const baseVal = parseFloat(el.getAttribute('data-base')) || 0;
                let res = Math.round(baseVal * mult * 10) / 10;
                el.innerText = res;
                sumG += res;
            });

            document.querySelectorAll('.ing-net-val').forEach(el => {
                const baseVal = parseFloat(el.getAttribute('data-base')) || 0;
                let res = Math.round(baseVal * mult * 10) / 10;
                el.innerText = res;
                sumN += res;
            });

            if (document.getElementById('sumGross')) document.getElementById('sumGross').innerText = Math.round(sumG);
            if (document.getElementById('sumNet')) document.getElementById('sumNet').innerText = Math.round(sumN);
        }

        function editRecipe(id) {
            const recipe = recipes.find(r => String(r.id) === String(id));
            if (recipe) {
                closeRecipeDetail();
                openConstructor(recipe);
            }
        }

        async function deleteRecipe(id) {
            if (!confirm('Точно удалить эту техкарту?')) return;

            if (supabaseClient) {
                try {
                    const { error } = await supabaseClient.from('recipes').delete().eq('id', id);
                    if (error) throw error;
                } catch (err) {
                    console.error('Ошибка удаления:', err);
                }
            }

            recipes = recipes.filter(r => String(r.id) !== String(id));
            localStorage.setItem('chef_recipes_cache', JSON.stringify(recipes));
            closeRecipeDetail();
            renderRecipesList();
        }

        async function saveRecipeToDB() {
            const id = document.getElementById('editingRecipeId').value;
            const title = document.getElementById('recipeTitle').value.trim();
            const category = document.getElementById('recipeCategory').value;
            const basePortions = parseInt(document.getElementById('recipePortionsInput').value) || 4;

            if (!title) {
                alert('Укажите название блюда!');
                return;
            }

            const ingredients = [];
            document.querySelectorAll('#ingredientsList > div').forEach(row => {
                const name = row.querySelector('.ing-name')?.value || '';
                const gross = parseFloat(row.querySelector('.ing-gross')?.value) || 0;
                const net = parseFloat(row.querySelector('.ing-net')?.value) || gross;
                const unit = row.querySelector('.ing-unit')?.value || 'г';
                if (name) ingredients.push({ name, gross, net, unit });
            });

            const steps = [];
            document.querySelectorAll('#stepsList > .step-row').forEach(row => {
                const method = row.querySelector('.step-method')?.value || 'колеровать';
                const text = row.querySelector('.step-desc')?.value || '';
                if (text) steps.push({ method, text });
            });

            const recipeData = {
                user_id: userId,
                title,
                category: category || 'Другое',
                base_portions: basePortions,
                ingredients,
                steps
            };

            if (supabaseClient) {
                try {
                    if (id) {
                        const { error } = await supabaseClient.from('recipes').update(recipeData).eq('id', id);
                        if (error) throw error;
                    } else {
                        const { error } = await supabaseClient.from('recipes').insert([recipeData]);
                        if (error) throw error;
                    }
                    alert('Техкарта успешно сохранена!');
                } catch (err) {
                    console.error('Ошибка сохранения:', err);
                    saveLocalFallback(recipeData, id);
                }
            } else {
                saveLocalFallback(recipeData, id);
            }

            closeConstructor();
            loadRecipes();
        }

        function saveLocalFallback(recipeData, id) {
            if (id) {
                recipes = recipes.map(r => String(r.id) === String(id) ? { ...recipeData, id } : r);
            } else {
                recipeData.id = 'loc-' + Date.now();
                recipes.unshift(recipeData);
            }
            localStorage.setItem('chef_recipes_cache', JSON.stringify(recipes));
        }

        window.onload = function() {
            loadRecipes();
        };
    </script>
</body>
