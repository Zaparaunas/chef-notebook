<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Блокнот Шефа • Telegram Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --tg-bg: var(--tg-theme-bg-color, #0f1215);
            --tg-card-bg: var(--tg-theme-secondary-bg-color, #181d23);
            --tg-text: var(--tg-theme-text-color, #f5f5f7);
            --tg-hint: var(--tg-theme-hint-color, #8e959d);
            --tg-button: var(--tg-theme-button-color, #2ea6ff);
            --tg-button-text: var(--tg-theme-button-text-color, #ffffff);
            --tg-border: rgba(255, 255, 255, 0.08);
        }

        body {
            background-color: var(--tg-bg);
            color: var(--tg-text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 12px;
            -webkit-font-smoothing: antialiased;
        }

        .app-container {
            max-width: 480px;
            margin: 0 auto;
        }

        /* Шапка */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 4px 16px 4px;
            border-bottom: 1px solid var(--tg-border);
            margin-bottom: 14px;
        }

        .header-title {
            font-size: 17px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .mode-btn {
            background: var(--tg-card-bg);
            border: 1px solid var(--tg-border);
            color: var(--tg-text);
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .mode-btn:active {
            transform: scale(0.95);
        }

        /* Карточка рецепта */
        .recipe-card {
            background: var(--tg-card-bg);
            border-radius: 16px;
            padding: 16px;
            border: 1px solid var(--tg-border);
            margin-bottom: 14px;
        }

        .recipe-name {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        /* Контроллер порций */
        .portions-control {
            margin-bottom: 16px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--tg-border);
        }

        .portions-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 15px;
            font-weight: 600;
        }

        .portions-slider {
            width: 100%;
            accent-color: var(--tg-button);
            cursor: pointer;
        }

        /* Секция ингредиентов */
        .section-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--tg-hint);
            margin: 16px 4px 8px 4px;
            font-weight: 700;
        }

        .ingredients-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .ingredient-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 10px;
            border: 1px solid var(--tg-border);
            cursor: pointer;
            user-select: none;
            transition: opacity 0.2s;
        }

        .ingredient-item.checked {
            opacity: 0.4;
            text-decoration: line-through;
        }

        .ing-name {
            font-size: 14px;
            font-weight: 500;
        }

        .ing-weight {
            font-size: 14px;
            font-weight: 700;
            color: var(--tg-button);
        }

        /* Специфичные PRO-элементы (скрыты по умолчанию в режиме Дом) */
        .pro-only {
            display: none;
            font-size: 11px;
            color: var(--tg-hint);
            margin-top: 2px;
        }

        body.pro-mode .pro-only {
            display: block;
        }

        /* Кнопка загрузки */
        .action-btn {
            background: var(--tg-button);
            color: var(--tg-button-text);
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Шапка -->
        <div class="header">
            <div class="header-title">
                <span>📜</span> Блокнот Шефа
            </div>
            <button class="mode-btn" id="modeToggleBtn" onclick="toggleMode()">Режим: Дом 🏡</button>
        </div>

        <!-- Карточка блюда -->
        <div class="recipe-card">
            <div class="recipe-name">Оссобуко по-милански</div>

            <!-- Управление порциями -->
            <div class="portions-control">
                <div class="portions-info">
                    <span>Порций:</span>
                    <span id="portionsValue" style="color: var(--tg-button);">4</span>
                </div>
                <input type="range" min="1" max="50" value="4" class="portions-slider" id="portionsSlider" oninput="updatePortions(this.value)">
            </div>

            <!-- Список ингредиентов -->
            <div class="section-title">Ингредиенты:</div>
            <div class="ingredients-list" id="ingredientsList">
                <!-- Динамически заполняется через JS -->
            </div>
        </div>

        <!-- Кнопка действия -->
        <button class="action-btn" onclick="openTelegramUpload()">
            <span>➕</span> Загрузить техкарту через Telegram
        </button>
    </div>

    <script>
        // Инициализация Telegram WebApp SDK
        let tg = window.Telegram.WebApp;
        tg.expand();

        // Базовые данные рецепта (рассчитаны на 4 порции)
        const basePortions = 4;
        const ingredients = [
            { name: "Говяжья голяшка", baseAmount: 500, unit: "г", loss: "Потери при зачистке: 15%" },
            { name: "Вино сухое белое", baseAmount: 100, unit: "мл", loss: "Упаривание: 10%" },
            { name: "Лук репчатый", baseAmount: 80, unit: "г", loss: "Очистка: 12%" },
            { name: "Морковь", baseAmount: 60, unit: "г", loss: "Очистка: 15%" },
            { name: "Бульон мясной", baseAmount: 250, unit: "мл", loss: "Без потерь" }
        ];

        let isProMode = false;

        // Рендер списка ингредиентов
        function renderIngredients(currentPortions) {
            const listContainer = document.getElementById('ingredientsList');
            listContainer.innerHTML = '';

            const factor = currentPortions / basePortions;

            ingredients.forEach((item, index) => {
                let calculatedAmount = Math.round(item.baseAmount * factor * 10) / 10;

                const row = document.createElement('div');
                row.className = 'ingredient-item';
                row.onclick = () => row.classList.toggle('checked');

                row.innerHTML = `
                    <div class="ing-info">
                        <div class="ing-name">• ${item.name}</div>
                        <div class="pro-only">⚖️ Брутто с учетом потерь (${item.loss})</div>
                    </div>
                    <div class="ing-weight">${calculatedAmount} ${item.unit}</div>
                `;
                listContainer.appendChild(row);
            });
        }

        // Обновление при движении ползунка
        function updatePortions(val) {
            document.getElementById('portionsValue').innerText = val;
            renderIngredients(parseInt(val));
            if (tg.HapticFeedback) {
                tg.HapticFeedback.selectionChanged();
            }
        }

        // Переключение режимов Дом / PRO
        function toggleMode() {
            isProMode = !isProMode;
            document.body.classList.toggle('pro-mode', isProMode);
            const btn = document.getElementById('modeToggleBtn');
            
            if (isProMode) {
                btn.innerText = "Режим: PRO 🔪";
                btn.style.borderColor = "var(--tg-button)";
            } else {
                btn.innerText = "Режим: Дом 🏡";
                btn.style.borderColor = "var(--tg-border)";
            }

            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }
        }

        function openTelegramUpload() {
            tg.showAlert("Здесь откроется интерфейс загрузки фото техкарты для распознавания ИИ!");
        }

        // Первичный запуск отрисовки
        renderIngredients(basePortions);
    </script>
</body>
</html>
