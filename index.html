<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Техкарты Шефа</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #ffffff);
            --text-color: var(--tg-theme-text-color, #222222);
            --hint-color: var(--tg-theme-hint-color, #999999);
            --button-color: var(--tg-theme-button-color, #2481cc);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
            --secondary-bg-color: var(--tg-theme-secondary-bg-color, #f1f1f1);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }
        h2, h3 { margin-top: 0; }
        .mode-toggle {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .mode-btn {
            flex: 1;
            padding: 10px;
            border: 1px solid var(--button-color);
            background: transparent;
            color: var(--button-color);
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }
        .mode-btn.active {
            background: var(--button-color);
            color: var(--button-text-color);
        }
        .action-btn {
            background: var(--button-color);
            color: var(--button-text-color);
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 15px;
        }
        /* Рубрикатор категорий */
        .categories-grid {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 15px;
        }
        .category-chip {
            background: var(--secondary-bg-color);
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 13px;
            white-space: nowrap;
            cursor: pointer;
            border: 1px solid transparent;
        }
        .category-chip.active {
            border-color: var(--button-color);
            font-weight: bold;
        }
        /* Карточки рецептов */
        .recipe-card {
            background: var(--secondary-bg-color);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 10px;
        }
        /* Конструктор */
        .admin-panel {
            background: var(--secondary-bg-color);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            background: var(--bg-color);
            color: var(--text-color);
        }
        /* Выделение названия блюда */
        #newTitle {
            font-size: 18px;
            font-weight: bold;
            border: 2px solid var(--button-color);
        }
        .ingredient-row, .step-row {
            display: flex;
            flex-direction: column;
            gap: 5px;
            background: var(--bg-color);
            padding: 8px;
            border-radius: 6px;
            margin-bottom: 8px;
        }
        .pro-fields {
            display: flex;
            gap: 5px;
        }
    </style>
</head>
<body>

    <div class="mode-toggle">
        <button id="btnSimple" class="mode-btn active" onclick="setMode('simple')">Режим: Дом</button>
        <button id="btnPro" class="mode-btn" onclick="setMode('pro')">Режим: Pro</button>
    </div>

    <!-- Кнопка создания техкарты -->
    <button id="createRecipeBtn" class="action-btn" onclick="openConstructor()">+ Новая тех карта</button>

    <!-- Рубрикатор категорий -->
    <div id="categoryClassifier" class="categories-grid">
        <div class="category-chip active" onclick="filterCategory('Все')">Все</div>
        <div class="category-chip" onclick="filterCategory('Мясо и птица')">🥩 Мясо и птица</div>
        <div class="category-chip" onclick="filterCategory('Рыба и морепродукты')">🐟 Рыба и морепродукты</div>
        <div class="category-chip" onclick="filterCategory('Овощи и грибы')">🥦 Овощи и грибы</div>
        <div class="category-chip" onclick="filterCategory('Крупы, макароны и бобовые')">🌾 Крупы и макароны</div>
        <div class="category-chip" onclick="filterCategory('Супы')">🍲 Супы</div>
        <div class="category-chip" onclick="filterCategory('Холодные блюда и закуски')">🥗 Закуски</div>
        <div class="category-chip" onclick="filterCategory('Соусы, маринады и заправки')">🍯 Соусы</div>
        <div class="category-chip" onclick="filterCategory('Полуфабрикаты и заготовки')">🍳 Заготовки</div>
        <div class="category-chip" onclick="filterCategory('Выпечка и десерты')">🥐 Выпечка и десерты</div>
        <div class="category-chip" onclick="filterCategory('Напитки')">🍷 Напитки</div>
        <div class="category-chip" onclick="filterCategory('Другое')">📌 Другое</div>
    </div>

    <!-- Конструктор / Редактор техкарт -->
    <div class="admin-panel" id="adminPanel" style="display: none;">
        <h3 id="constructorTitle">➕ Новая техкарта</h3>
        
        <!-- Название блюда (выделено) -->
        <input type="text" id="newTitle" placeholder="Введите название блюда..." oninput="checkTitleInput()">

        <!-- Поля, скрытые до ввода названия -->
        <div id="constructorBody" style="display: none;">
            <select id="recipeCategory">
                <option value="" disabled selected>Выберите категорию...</option>
                <option value="Мясо и птица">Мясо и птица</option>
                <option value="Рыба и морепродукты">Рыба и морепродукты</option>
                <option value="Овощи и грибы">Овощи и грибы</option>
                <option value="Крупы, макароны и бобовые">Крупы, макароны и бобовые</option>
                <option value="Супы">Супы</option>
                <option value="Холодные блюда и закуски">Холодные блюда и закуски</option>
                <option value="Соусы, маринады и заправки">Соусы, маринады и заправки</option>
                <option value="Полуфабрикаты и заготовки">Полуфабрикаты и заготовки</option>
                <option value="Выпечка и десерты">Выпечка и десерты</option>
                <option value="Напитки">Напитки</option>
                <option value="Другое">Другое</option>
            </select>

            <!-- Порции: ползунок до 20 + ручной ввод -->
            <div style="margin-bottom: 10px; display: flex; align-items: center; gap: 10px;">
                <label style="font-size: 13px; color: var(--hint-color);">Порции:</label>
                <input type="range" id="recipePortionsRange" min="1" max="20" value="4" oninput="syncPortionsRange(this.value)" style="flex: 2; margin-bottom: 0;">
                <input type="number" id="recipePortionsNum" min="1" value="4" placeholder="Порций" oninput="syncPortionsNum(this.value)" style="flex: 1; margin-bottom: 0; text-align: center;">
            </div>

            <h4>Ингредиенты:</h4>
            <div id="ingredientsList"></div>
            <button class="mode-btn" style="width: 100%; margin-bottom: 15px;" onclick="addIngredientRow()">+ Добавить ингредиент</button>

            <h4>Шаги приготовления:</h4>
            <div id="stepsList"></div>
            <button class="mode-btn" style="width: 100%; margin-bottom: 15px;" onclick="addStepRow()">+ Добавить шаг</button>

            <div style="display: flex; gap: 10px;">
                <button class="action-btn" onclick="saveRecipe()" style="flex: 2; margin-bottom: 0;">Сохранить в базу</button>
                <button class="mode-btn" onclick="closeConstructor()" style="flex: 1; margin-bottom: 0;">Отмена</button>
            </div>
        </div>
    </div>

    <!-- Список рецептов -->
    <div id="recipesContainer">
        <p style="text-align: center; color: var(--hint-color);">Загрузка рецептов из Supabase...</p>
    </div>

<script>
    // Вшитые учетные данные Supabase и Telegram
    const SUPABASE_URL = 'https://fxvporgpgpxudzlbauty.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_kcUT9hJ_k8e-2sj0j8BbAA_QvG8Wc-p';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentMode = 'simple';
    let editingRecipeId = null;
    let recipes = [];

    const tg = window.Telegram.WebApp;
    tg.expand();

    async function initApp() {
        await loadRecipesFromSupabase();
    }

    async function loadRecipesFromSupabase() {
        const { data, error } = await supabaseClient
            .from('recipes')
            .select('*')
            .order('created_at', { ascending: false });

        if (error) {
            console.error('Ошибка загрузки из Supabase:', error);
            document.getElementById('recipesContainer').innerHTML = `<p style="text-align: center; color: red;">Ошибка загрузки базы данных.</p>`;
            return;
        }

        recipes = data || [];
        renderRecipes();
    }

    function setMode(mode) {
        currentMode = mode;
        document.getElementById('btnSimple').classList.toggle('active', mode === 'simple');
        document.getElementById('btnPro').classList.toggle('active', mode === 'pro');
        renderRecipes();
    }

    function checkTitleInput() {
        const titleVal = document.getElementById('newTitle').value.trim();
        const body = document.getElementById('constructorBody');
        body.style.display = titleVal.length > 0 ? 'block' : 'none';
    }

    function openConstructor(recipe = null) {
        document.getElementById('createRecipeBtn').style.display = 'none';
        document.getElementById('categoryClassifier').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'block';
        
        document.getElementById('ingredientsList').innerHTML = '';
        document.getElementById('stepsList').innerHTML = '';

        if (recipe) {
            editingRecipeId = recipe.id;
            document.getElementById('constructorTitle').textContent = '✏️ Редактирование техкарты';
            document.getElementById('newTitle').value = recipe.title || '';
            checkTitleInput();
            document.getElementById('recipeCategory').value = recipe.category || '';
            
            const portions = recipe.base_portions || 4;
            document.getElementById('recipePortionsRange').value = portions <= 20 ? portions : 20;
            document.getElementById('recipePortionsNum').value = portions;
            if (portions > 20) {
                document.getElementById('recipePortionsRange').style.display = 'none';
            } else {
                document.getElementById('recipePortionsRange').style.display = 'block';
            }

            let parsedIngredients = recipe.ingredients;
            if (typeof parsedIngredients === 'string') {
                try { parsedIngredients = JSON.parse(parsedIngredients); } catch(e) { parsedIngredients = []; }
            }
            (parsedIngredients || []).forEach(ing => addIngredientRow(ing));

            let parsedSteps = recipe.steps;
            if (typeof parsedSteps === 'string') {
                try { parsedSteps = JSON.parse(parsedSteps); } catch(e) { parsedSteps = []; }
            }
            (parsedSteps || []).forEach(stp => addStepRow(stp));
        } else {
            editingRecipeId = null;
            document.getElementById('constructorTitle').textContent = '➕ Новая техкарта';
            document.getElementById('newTitle').value = '';
            checkTitleInput();
            document.getElementById('recipeCategory').selectedIndex = 0;
            document.getElementById('recipePortionsRange').value = 4;
            document.getElementById('recipePortionsRange').style.display = 'block';
            document.getElementById('recipePortionsNum').value = 4;
            addIngredientRow();
            addStepRow();
        }
    }

    function closeConstructor() {
        document.getElementById('adminPanel').style.display = 'none';
        document.getElementById('createRecipeBtn').style.display = 'block';
        document.getElementById('categoryClassifier').style.display = 'flex';
        editingRecipeId = null;
    }

    function syncPortionsRange(val) {
        document.getElementById('recipePortionsNum').value = val;
    }

    function syncPortionsNum(val) {
        const range = document.getElementById('recipePortionsRange');
        const num = parseInt(val);
        if (num > 20 || isNaN(num)) {
            range.style.display = 'none';
        } else {
            range.style.display = 'block';
            range.value = num;
        }
    }

    function addIngredientRow(data = {}) {
        const container = document.getElementById('ingredientsList');
        const div = document.createElement('div');
        div.className = 'ingredient-row';
        
        let proHtml = '';
        if (currentMode === 'pro') {
            const gross = data.gross || '';
            const net = data.net || '';
            const loss = (gross && net && gross >= net) ? (((gross - net) / gross) * 100).toFixed(1) + '%' : '0%';
            proHtml = `
                <div class="pro-fields">
                    <input type="number" placeholder="Брутто (г)" value="${gross}" oninput="calcLoss(this)" class="ing-gross">
                    <input type="number" placeholder="Нетто (г)" value="${net}" oninput="calcLoss(this)" class="ing-net">
                    <input type="text" placeholder="Потери" value="${loss}" readonly style="background: var(--secondary-bg-color); text-align: center;" class="ing-loss">
                </div>
            `;
        } else {
            proHtml = `<input type="number" placeholder="Вес (г)" value="${data.weight || data.net || ''}" class="ing-weight">`;
        }

        div.innerHTML = `
            <input type="text" placeholder="Название ингредиента" value="${data.name || ''}" class="ing-name">
            ${proHtml}
            <button type="button" class="mode-btn" style="color: red; border-color: red; padding: 4px;" onclick="this.parentElement.remove()">Удалить ингредиент</button>
        `;
        container.appendChild(div);
    }

    function calcLoss(element) {
        const row = element.closest('.ingredient-row');
        const gross = parseFloat(row.querySelector('.ing-gross').value) || 0;
        const net = parseFloat(row.querySelector('.ing-net').value) || 0;
        const lossField = row.querySelector('.ing-loss');
        if (gross > 0 && gross >= net) {
            const loss = ((gross - net) / gross) * 100;
            lossField.value = loss.toFixed(1) + '%';
        } else {
            lossField.value = '0%';
        }
    }

    function addStepRow(data = {}) {
        const container = document.getElementById('stepsList');
        const div = document.createElement('div');
        div.className = 'step-row';
        
        const methods = ['бланшировать', 'варить', 'тушить', 'пар', 'жар/пар', 'жар', 'жарить', 'колеровать', 'гриль'];
        let optionsHtml = methods.map(m => `<option value="${m}" ${(data.method === m) ? 'selected' : ''}>${m}</option>`).join('');

        div.innerHTML = `
            <textarea placeholder="Описание шага приготовления..." rows="2" class="step-desc">${data.desc || (typeof data === 'string' ? data : '')}</textarea>
            <label style="font-size: 11px; color: var(--hint-color); margin-top: 2px;">Метод приготовления:</label>
            <select class="step-method">
                ${optionsHtml}
            </select>
            <button type="button" class="mode-btn" style="color: red; border-color: red; padding: 4px;" onclick="this.parentElement.remove()">Удалить шаг</button>
        `;
        container.appendChild(div);
    }

    async function saveRecipe() {
        const title = document.getElementById('newTitle').value.trim();
        const category = document.getElementById('recipeCategory').value;
        const base_portions = parseInt(document.getElementById('recipePortionsNum').value) || 4;

        if (!title) {
            alert('Введите название блюда!');
            return;
        }
        if (!category) {
            alert('Выберите категорию!');
            return;
        }

        const ingredients = [];
        document.querySelectorAll('.ingredient-row').forEach(row => {
            const name = row.querySelector('.ing-name').value;
            if (currentMode === 'pro') {
                ingredients.push({
                    name,
                    gross: parseFloat(row.querySelector('.ing-gross').value) || 0,
                    net: parseFloat(row.querySelector('.ing-net').value) || 0
                });
            } else {
                ingredients.push({
                    name,
                    weight: parseFloat(row.querySelector('.ing-weight').value) || 0
                });
            }
        });

        const steps = [];
        document.querySelectorAll('.step-row').forEach(row => {
            steps.push({
                desc: row.querySelector('.step-desc').value,
                method: row.querySelector('.step-method').value
            });
        });

        const recipeData = {
            title,
            category,
            base_portions,
            ingredients,
            steps,
            user_id: tg.initDataUnsafe?.user?.id ? String(tg.initDataUnsafe.user.id) : 'default_chef'
        };

        let error;
        if (editingRecipeId) {
            const res = await supabaseClient.from('recipes').update(recipeData).eq('id', editingRecipeId);
            error = res.error;
        } else {
            const res = await supabaseClient.from('recipes').insert([recipeData]);
            error = res.error;
        }

        if (error) {
            alert('Ошибка при сохранении: ' + error.message);
            return;
        }

        closeConstructor();
        await loadRecipesFromSupabase();
    }

    let activeFilter = 'Все';
    function filterCategory(cat) {
        activeFilter = cat;
        document.querySelectorAll('.category-chip').forEach(chip => {
            chip.classList.toggle('active', chip.textContent.includes(cat) || (cat === 'Все' && chip.textContent === 'Все'));
        });
        renderRecipes();
    }

    function renderRecipes() {
        const container = document.getElementById('recipesContainer');
        container.innerHTML = '';

        let filtered = recipes;
        if (activeFilter !== 'Все') {
            filtered = recipes.filter(r => r.category === activeFilter);
        }

        if (filtered.length === 0) {
            container.innerHTML = `<p style="text-align: center; color: var(--hint-color);">Техкарт пока нет в категории «${activeFilter}».</p>`;
            return;
        }

        filtered.forEach(recipe => {
            const card = document.createElement('div');
            card.className = 'recipe-card';
            
            let ingredientsArr = recipe.ingredients;
            if (typeof ingredientsArr === 'string') {
                try { ingredientsArr = JSON.parse(ingredientsArr); } catch(e) { ingredientsArr = []; }
            }

            let ingListHtml = (ingredientsArr || []).map(i => {
                if (currentMode === 'pro') {
                    let gross = i.gross || 0;
                    let net = i.net || i.weight || 0;
                    let loss = (gross && net && gross >= net) ? (((gross - net) / gross) * 100).toFixed(1) + '%' : '0%';
                    return `<li>${i.name || 'Ингредиент'} — Брутто: ${gross}г, Нетто: ${net}г (Потери: ${loss})</li>`;
                } else {
                    let w = i.weight || i.net || 0;
                    return `<li>${i.name || 'Ингредиент'} — ${w}г</li>`;
                }
            }).join('');

            let stepsArr = recipe.steps;
            if (typeof stepsArr === 'string') {
                try { stepsArr = JSON.parse(stepsArr); } catch(e) { stepsArr = []; }
            }

            let stepsListHtml = (stepsArr || []).map((s, idx) => {
                let desc = typeof s === 'object' ? s.desc : s;
                let method = typeof s === 'object' ? s.method : 'не указан';
                return `<li>Шаг ${idx+1}: ${desc} <br><b>Метод:</b> ${method}</li>`;
            }).join('');

            card.innerHTML = `
                <h3 style="margin-bottom: 5px;">${recipe.title}</h3>
                <div style="font-size: 12px; color: var(--hint-color); margin-bottom: 8px;">Категория: ${recipe.category} | Порций: ${recipe.base_portions || 4}</div>
                <div style="font-size: 13px; margin-bottom: 6px;"><b>Ингредиенты:</b><ul>${ingListHtml}</ul></div>
                <div style="font-size: 13px; margin-bottom: 10px;"><b>Шаги:</b><ol>${stepsListHtml}</ol></div>
                <button class="mode-btn" onclick='editRecipe("${recipe.id}")'>Редактировать техкарту</button>
            `;
            container.appendChild(card);
        });
    }

    function editRecipe(id) {
        const recipe = recipes.find(r => r.id == id);
        if (recipe) openConstructor(recipe);
    }

    // Запуск инициализации при загрузке страницы
    initApp();
</script>
</body>
</html>
