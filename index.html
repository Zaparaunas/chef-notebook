<style>
    /* Стили для названий ингредиентов: черный текст на белом фоне */
    .ingredient-name-input, .ingredient-row input {
        color: #000000 !important;
        background-color: #ffffff !important;
    }
    
    /* Контейнер для метода готовки и температуры на одной строке */
    .cooking-row {
        display: flex;
        gap: 10px;
        align-items: center;
        margin-top: 6px;
    }
    .cooking-row select, .cooking-row input[type="number"] {
        padding: 6px;
        border-radius: 4px;
        border: 1px solid #ccc;
    }
    .cooking-row input[type="number"] {
        width: 90px;
    }
</style>

<!-- Пример разметки шага с методом готовки и температурой -->
<div class="step-item">
    <textarea placeholder="Описание шага приготовления..."></textarea>
    <div class="cooking-row">
        <select class="cooking-method-select">
            <option value="" disabled selected>Выберите метод...</option>
            <option value="бланшировать">бланшировать</option>
            <option value="варить">варить</option>
            <option value="тушить">тушить</option>
            <option value="пар">пар</option>
            <option value="жар/пар">жар/пар</option>
            <option value="жар">жар</option>
            <option value="жарить">жарить</option>
            <option value="фритюр">фритюр</option>
            <option value="колеровать">колеровать</option>
            <option value="гриль">гриль</option>
        </select>
        <input type="number" min="-18" max="300" placeholder="°C (-18..300)" title="Температура в градусах Цельсия от -18 до 300">
    </div>
</div>
