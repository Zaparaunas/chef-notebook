<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Блокнот Шефа</title>
    <!-- Подключаем Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Подключаем Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #121212);
            --text-color: var(--tg-theme-text-color, #ffffff);
            --hint-color: var(--tg-theme-hint-color, #aaaaaa);
            --button-color: var(--tg-theme-button-color, #ea580c);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
            --card-bg: #1e1e1e;
            --border-color: #333333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }

        h2, h3 { margin-top: 0; }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .mode-switch {
            display: flex;
            background: var(--card-bg);
            border-radius: 8px;
            padding: 4px;
            border: 1px solid var(--border-color);
        }

        .mode-btn {
            background: transparent;
            border: none;
            color: var(--hint-color);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }

        .mode-btn.active {
            background: var(--button-color);
            color: var(--button-text-color);
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            background: #2a2a2a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            box-sizing: border-box;
            font-size: 14px;
        }

        button.primary {
            background-color: var(--button-color);
            color: var(--button-text-color);
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            font-size: 15px;
            margin-top: 5px;
        }

        button.secondary {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
        }

        button.danger {
            background: #dc2626;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
        }

        .ingredient-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 40px;
            gap: 8px;
            margin-bottom: 8px;
            align-items: center;
        }

        .actions-row {
            display: flex;
            gap: 10px;
        }

        .recipe-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .badge {
            background: #333;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            color: var(--hint-color);
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>👨‍🍳 Блокнот Шефа</h2>
        <div class="mode-switch">
            <button class="mode-btn active" id="btnSimple" onclick="setMode('simple')">Дом</button>
            <button class="mode-btn" id="btnPro" onclick="setMode('pro')">Pro</button>
        </div>
    </div>

    <!-- Уведомление о черновике -->
    <div id="draftNotification" class="card" style="display: none; border-color: var(--button-color);">
        <p style="margin: 0 0 10px 0; font-size: 14px;">📦 Найден несохраненный черновик рецепта.</p>
        <div class="actions-row">
            <button class="primary" onclick="restoreDraft()" style="margin-top: 0;">Восстановить</button>
            <button class="secondary" onclick="discardDraft()" style="margin-top: 0;">Удалить</button>
        </div>
    </div>

    <!-- Кнопки управления списком -->
    <div style="margin-bottom: 16px; display: flex; gap: 10px; flex-wrap: wrap;">
        <button class="primary" onclick="openConstructor()" style="flex: 1;">+ Новая техкарта</button>
        <button class="secondary" onclick="loadDemoRecipes()">📥 Загрузить демо</button>
    </div>

    <!-- Список рецептов -->
    <div id="recipesContainer">
        <p style="color: var(--hint-color); text-align: center;">Загрузка рецептов...</p>
    </div>

    <!-- Конструктор / Редактор рецепта -->
    <div id="recipeConstructor" class="card" style="display: none;">
        <h3>Создание техкарты</h3>
        <input type="text" id="recipeTitle" placeholder="Название блюда (например, Борщ классический)" oninput="saveDraftLocally()">
        <input type="text" id="recipeCategory" placeholder="Категория (Супы, Горячее, Заготовки)" oninput="saveDraftLocally()">
        
        <label style="font-size: 12px; color: var(--hint-color);" id="portionsLabel">Базовых порций: <span id="portionsValue">4</span></label>
        <!-- Динамическое поле порций (инпут для Pro, ползунок для Дом) -->
        <div id="portionsContainer">
            <input type="range" id="recipePortionsRange" min="1" max="20" value="4" oninput="updatePortionsVal(this.value); saveDraftLocally()">
        </div>

        <h4>Ингредиенты:</h4>
        <div id="ingredientsList"></div>
        <button class="secondary" onclick="addIngredientRow()" style="margin-bottom: 15px;">+ Добавить ингредиент</button>

        <h4>Порядок приготовления:</h4>
        <textarea id="recipeSteps" rows="4" placeholder="Опишите шаги приготовления..." oninput="saveDraftLocally()"></textarea>

        <div class="actions-row">
            <button class="primary" onclick="saveRecipe()" style="flex: 2;">Сохранить в базу</button>
            <button class="secondary" onclick="cancelConstructor()" style="flex: 1;">Отмена</button>
        </div>
    </div>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand();

        const userId = tg.initDataUnsafe?.user?.id ? String(tg.initDataUnsafe.user.id) : 'demo_user_123';
        let currentMode = 'simple';

        // Настройки Supabase
        const SUPABASE_URL = 'https://fxvporgpgpxudzlbauty.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ4dnBvcmdwZ3B4dWR6bGJhdXR5Iiwicm9sZSI6ImFub24iLCJpYXQiOjQ3NTQwNzQ2ODN9.hWz737eB_g2u6mBvK6-2g7zY8h7B7g7h8J7K7L7M7N7'; // Замените при необходимости на ваш публичный ключ
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Переключение режимов Дом / Pro
        function setMode(mode) {
            currentMode = mode;
            document.getElementById('btnSimple').classList.toggle('active', mode === 'simple');
            document.getElementById('btnPro').classList.toggle('active', mode === 'pro');
            
            const container = document.getElementById('portionsContainer');
            const currentVal = document.getElementById('recipePortionsRange')?.value || document.getElementById('recipePortionsInput')?.value || 4;
            
            if (mode === 'pro') {
                container.innerHTML = `<input type="number" id="recipePortionsInput" value="${currentVal}" min="1" max="10000" oninput="saveDraftLocally()">`;
                document.getElementById('portionsLabel').style.display = 'none';
            } else {
                container.innerHTML = `<input type="range" id="recipePortionsRange" min="1" max="20" value="${currentVal > 20 ? 20 : currentVal}" oninput="updatePortionsVal(this.value); saveDraftLocally()">`;
                document.getElementById('portionsLabel').style.display = 'block';
                document.getElementById('portionsValue').innerText = currentVal > 20 ? 20 : currentVal;
            }
        }

        function updatePortionsVal(val) {
            document.getElementById('portionsValue').innerText = val;
        }

        function getPortionsCount() {
            if (currentMode === 'pro') {
                return parseInt(document.getElementById('recipePortionsInput')?.value) || 4;
            } else {
                return parseInt(document.getElementById('recipePortionsRange')?.value) || 4;
            }
        }

        // Локальное автосохранение черновиков
        window.addEventListener('DOMContentLoaded', () => {
            const savedDraft = localStorage.getItem('chef_recipe_draft');
            if (savedDraft) {
                document.getElementById('draftNotification').style.display = 'block';
            }
            fetchRecipes();
        });

        function saveDraftLocally() {
            const draft = {
                title: document.getElementById('recipeTitle').value,
                category: document.getElementById('recipeCategory').value,
                portions: getPortionsCount(),
                steps: document.getElementById('recipeSteps').value,
                ingredients: getIngredientsFromDOM()
            };
            localStorage.setItem('chef_recipe_draft', JSON.stringify(draft));
        }

        function restoreDraft() {
            const savedDraft = localStorage.getItem('chef_recipe_draft');
            if (!savedDraft) return;
            try {
                const draft = JSON.parse(savedDraft);
                document.getElementById('recipeTitle').value = draft.title || '';
                document.getElementById('recipeCategory').value = draft.category || '';
                if (draft.portions) {
                    if (currentMode === 'pro') {
                        const inp = document.getElementById('recipePortionsInput');
                        if (inp) inp.value = draft.portions;
                    } else {
                        const rng = document.getElementById('recipePortionsRange');
                        if (rng) { rng.value = draft.portions; updatePortionsVal(draft.portions); }
                    }
                }
                document.getElementById('recipeSteps').value = draft.steps || '';
                
                const list = document.getElementById('ingredientsList');
                list.innerHTML = '';
                if (draft.ingredients && draft.ingredients.length > 0) {
                    draft.ingredients.forEach(ing => addIngredientRow(ing.name, ing.gross, ing.unit));
                } else {
                    addIngredientRow();
                }

                document.getElementById('recipeConstructor').style.display = 'block';
                document.getElementById('draftNotification').style.display = 'none';
            } catch (e) {
                console.error('Ошибка восстановления черновика', e);
            }
        }

        function discardDraft() {
            localStorage.removeItem('chef_recipe_draft');
            document.getElementById('draftNotification').style.display = 'none';
        }

        // Конструктор
        function openConstructor() {
            document.getElementById('recipeConstructor').style.display = 'block';
            document.getElementById('recipeTitle').value = '';
            document.getElementById('recipeCategory').value = '';
            document.getElementById('recipeSteps').value = '';
            document.getElementById('ingredientsList.innerHTML') = '';
            addIngredientRow();
        }

        function cancelConstructor() {
            if (confirm('Сбросить текущие изменения и закрыть конструктор?')) {
                document.getElementById('recipeConstructor').style.display = 'none';
                discardDraft();
            }
        }

        function addIngredientRow(name = '', gross = '', unit = 'г') {
            const list = document.getElementById('ingredientsList');
            const row = document.createElement('div');
            row.className = 'ingredient-row';
            row.innerHTML = `
                <input type="text" class="ing-name" placeholder="Продукт" value="${name}" oninput="saveDraftLocally()">
                <input type="number" class="ing-gross" placeholder="Брутто" value="${gross}" oninput="saveDraftLocally()">
                <select class="ing-unit" onchange="saveDraftLocally()">
                    <option value="г" ${unit==='г'?'selected':''}>г</option>
                    <option value="кг" ${unit==='кг'?'selected':''}>кг</option>
                    <option value="мл" ${unit==='мл'?'selected':''}>мл</option>
                    <option value="л" ${unit==='л'?'selected':''}>л</option>
                    <option value="шт" ${unit==='шт'?'selected':''}>шт</option>
                </select>
                <button class="danger" onclick="this.parentElement.remove(); saveDraftLocally()">✕</button>
            `;
            list.appendChild(row);
        }

        function getIngredientsFromDOM() {
            const rows = document.querySelectorAll('.ingredient-row');
            let items = [];
            rows.forEach(r => {
                items.push({
                    name: r.querySelector('.ing-name').value,
                    gross: parseFloat(r.querySelector('.ing-gross').value) || 0,
                    unit: r.querySelector('.ing-unit').value
                });
            });
            return items;
        }

        // Загрузка рецептов из Supabase
        async function fetchRecipes() {
            const container = document.getElementById('recipesContainer');
            try {
                const { data, error } = await supabase
                    .from('recipes')
                    .select('*')
                    .order('id', { ascending: false });

                if (error) throw error;

                if (!data || data.length === 0) {
                    container.innerHTML = '<p style="color: var(--hint-color); text-align: center;">Пока нет сохраненных рецептов.</p>';
                    return;
                }

                container.innerHTML = '';
                data.forEach(recipe => {
                    const el = document.createElement('div');
                    el.className = 'recipe-item';
                    el.innerHTML = `
                        <div>
                            <strong>${recipe.title}</strong><br>
                            <span class="badge">${recipe.category || 'Общее'}</span> • Порций: ${recipe.base_portions}
                        </div>
                        <button class="danger" onclick="deleteRecipe('${recipe.id}')">Удалить</button>
                    `;
                    container.appendChild(el);
                });
            } catch (err) {
                console.error(err);
                container.innerHTML = `<p style="color: #dc2626; text-align: center;">Ошибка загрузки: ${err.message}</p>`;
            }
        }

        // Сохранение рецепта в Supabase
        async function saveRecipe() {
            const title = document.getElementById('recipeTitle').value.trim();
            const category = document.getElementById('recipeCategory').value.trim();
            const base_portions = getPortionsCount();
            const steps = document.getElementById('recipeSteps').value.trim();
            const ingredients = getIngredientsFromDOM();

            if (!title) {
                alert('Пожалуйста, введите название блюда!');
                return;
            }

            try {
                // 1. Сохраняем рецепт в таблицу recipes
                const { data: recipeData, error: recipeError } = await supabase
                    .from('recipes')
                    .insert([{ user_id: userId, title, category, base_portions, steps }])
                    .select()
                    .single();

                if (recipeError) throw recipeError;

                const recipeId = recipeData.id;

                // 2. Сохраняем ингредиенты в таблицу ingredients
                if (ingredients.length > 0) {
                    const ingRows = ingredients.map(ing => ({
                        recipe_id: recipeId,
                        name: ing.name || 'Продукт',
                        gross: ing.gross,
                        net: ing.gross,
                        unit: ing.unit
                    }));

                    const { error: ingError } = await supabase.from('ingredients').insert(ingRows);
                    if (ingError) throw ingError;
                }

                alert('Рецепт успешно сохранен!');
                document.getElementById('recipeConstructor').style.display = 'none';
                discardDraft();
                fetchRecipes();
            } catch (err) {
                alert('Ошибка сохранения рецепта: ' + err.message);
                console.error(err);
            }
        }

        // Удаление рецепта
        async function deleteRecipe(id) {
            if (!confirm('Точно удалить этот рецепт?')) return;
            try {
                await supabase.from('ingredients').delete().eq('recipe_id', id);
                const { error } = await supabase.from('recipes').delete().eq('id', id);
                if (error) throw error;
                fetchRecipes();
            } catch (err) {
                alert('Ошибка удаления: ' + err.message);
            }
        }

        // Загрузка демо-рецептов для тестирования
        async function loadDemoRecipes() {
            try {
                const demos = [
                    { title: 'Борщ классический (Демо)', category: 'Супы', base_portions: 4, steps: 'Отварить бульон, пассеровать овощи, соединить и проварить.' },
                    { title: 'Оссобуко по-милански (Демо)', category: 'Горячее', base_portions: 2, steps: 'Обжарить телятину, тушить с овощами и белым вином.' }
                ];

                for (let d of demos) {
                    await supabase.from('recipes').insert([{ user_id: userId, ...d }]);
                }

                alert('Демо-рецепты успешно добавлены!');
                fetchRecipes();
            } catch (err) {
                alert('Ошибка загрузки демо: ' + err.message);
            }
        }
    </script>
</body>
</html>
