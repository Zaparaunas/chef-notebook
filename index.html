<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Блокнот Шефа</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #ffffff);
            --text-color: var(--tg-theme-text-color, #000000);
            --hint-color: var(--tg-theme-hint-color, #999999);
            --button-color: var(--tg-theme-button-color, #2481cc);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
            --secondary-bg-color: var(--tg-theme-secondary-bg-color, #f1f1f1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        h2, h3, h4 { margin: 0 0 10px 0; }

        button {
            background-color: var(--button-color);
            color: var(--button-text-color);
            border: none;
            border-radius: 8px;
            padding: 10px 16px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        button.secondary {
            background-color: var(--secondary-bg-color);
            color: var(--text-color);
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid var(--hint-color);
            border-radius: 8px;
            background: var(--bg-color);
            color: var(--text-color);
            box-sizing: border-box;
        }

        .card {
            background: var(--secondary-bg-color);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .card:active {
            opacity: 0.7;
        }

        .mode-switch {
            display: flex;
            background: var(--secondary-bg-color);
            border-radius: 8px;
            padding: 2px;
        }

        .mode-btn {
            background: transparent;
            color: var(--text-color);
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
        }

        .mode-btn.active {
            background: var(--button-color);
            color: var(--button-text-color);
        }

        .ingredient-item.checked span {
            text-decoration: line-through;
            opacity: 0.5;
        }
    </style>
</head>
<body>

    <!-- Шапка приложения -->
    <div class="header">
        <h2>👨‍🍳 Блокнот Шефа</h2>
        <div class="mode-switch">
            <button class="mode-btn active" id="btnSimple" onclick="setMode('simple')">Дом 🏡</button>
            <button class="mode-btn" id="btnPro" onclick="setMode('pro')">Pro 🔪</button>
        </div>
    </div>

    <!-- Уведомление о черновике -->
    <div id="draftNotification" class="card" style="display: none; border: 1px solid var(--button-color); cursor: default;">
        <p style="margin: 0 0 10px 0; font-size: 14px;">📦 Обнаружен несохраненный черновик рецепта.</p>
        <div style="display: flex; gap: 10px;">
            <button onclick="restoreDraft()">Восстановить</button>
            <button class="secondary" onclick="discardDraft()">Удалить</button>
        </div>
    </div>

    <!-- Главный экран: Кнопки управления -->
    <div id="mainScreen">
        <div style="margin-bottom: 16px; display: flex; gap: 10px;">
            <button onclick="openConstructor()" style="flex: 1;">+ Новая техкарта</button>
            <button class="secondary" onclick="loadRecipesFromSupabase()">🔄 Обновить</button>
        </div>

        <!-- Список рецептов из базы -->
        <div id="recipesContainer">
            <p style="color: var(--hint-color); text-align: center;">Загрузка рецептов...</p>
        </div>
    </div>

    <!-- Экран детального просмотра рецепта -->
    <div id="recipeDetailScreen" style="display: none;">
        <button class="secondary" onclick="closeRecipeDetail()" style="margin-bottom: 14px;">← Назад к списку</button>
        <div class="card" style="cursor: default;" id="detailContent">
            <!-- Сюда подгружается детальная инфо -->
        </div>
    </div>

    <!-- Конструктор / Редактор техкарты -->
    <div id="recipeConstructor" class="card" style="display: none; cursor: default;">
        <h3 style="font-size: 18px; border-bottom: 2px solid var(--button-color); padding-bottom: 6px; margin-bottom: 14px;">🍳 Создание техкарты</h3>
        
        <!-- Название блюда -->
        <div style="margin-bottom: 14px;">
            <label style="font-size: 13px; font-weight: 700; color: var(--text-color);">Название блюда *</label>
            <input type="text" id="recipeTitle" placeholder="Например, Оссобуко по-милански" oninput="handleTitleInput(this.value); saveDraftLocally()" style="font-size: 16px; font-weight: 600; border: 2px solid var(--button-color);">
        </div>

        <!-- Динамическое тело формы -->
        <div id="dynamicFormBody" style="display: none;">
            
            <!-- Категория -->
            <div style="margin-bottom: 14px;">
                <label style="font-size: 12px; color: var(--hint-color);">Категория</label>
                <select id="recipeCategory" onchange="saveDraftLocally()">
                    <option value="" disabled selected>Выберите категорию...</option>
                    <option value="Мясо и птица">Мясо и птица</option>
                    <option value="Рыба и морепродукты">Рыба и морепродукты</option>
                    <option value="Овощи и грибы">Овощи и грибы</option>
                    <option value="Крупы, макароны и бобовые">Крупы, макароны и бобовые</option>
                    <option value="Супы">Супы</option>
                    <option value="Холодные блюда и закуски">Холодные блюда и закуски</option>
                    <option value="Соусы, маринады и заправки">Соусы, маринады и заправки</option>
                    <option value="Полуфабрикаты и заготовки">Полуфабрикаты и заготовки</option>
                    <option value="Выпечка и десерты">Выпечка и десерты</option>
                    <option value="Напитки">Напитки</option>
                    <option value="Другое">Другое</option>
                </select>
            </div>

            <!-- Порции (ползунок + ввод) -->
            <div style="margin-bottom: 14px;">
                <label style="font-size: 12px; color: var(--hint-color);">Количество порций (base_portions)</label>
                <div style="display: flex; align-items: center; gap: 10px; margin-top: 4px;">
                    <input type="range" id="recipePortionsRange" min="1" max="20" value="4" oninput="syncPortions('range', this.value)" style="flex: 1; margin: 0;">
                    <input type="number" id="recipePortionsInput" min="1" max="1000" value="4" oninput="syncPortions('input', this.value)" style="width: 70px; margin: 0; text-align: center; font-weight: 600;">
                </div>
            </div>

            <!-- Ингредиенты -->
            <h4 style="margin: 16px 0 8px 0; font-size: 14px;">Ингредиенты:</h4>
            <div id="ingredientsList" style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px;"></div>
            <button class="secondary" onclick="addIngredientRow()" style="width: 100%; margin-bottom: 16px;">+ Добавить ингредиент</button>

            <!-- Шаги приготовления -->
            <h4 style="margin: 16px 0 8px 0; font-size: 14px;">Шаги приготовления:</h4>
            <div id="stepsList" style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 10px;"></div>
            <button class="secondary" onclick="addStepRow()" style="width: 100%; margin-bottom: 20px;">+ Добавить шаг</button>

            <!-- Кнопки сохранения / отмены -->
            <div style="display: flex; gap: 10px;">
                <button class="secondary" onclick="openConstructor()" style="flex: 1;">Отмена</button>
                <button onclick="saveNewRecipe()" style="flex: 2;">Сохранить в базу</button>
            </div>
        </div>
    </div>

    <script>
        // Инициализация Telegram WebApp
        let tg = window.Telegram?.WebApp;
        if (tg) { tg.expand(); }

        // Получаем уникальный user_id из Telegram или генерируем дефолтный для тегов в браузере
        const userId = tg?.initDataUnsafe?.user?.id ? String(tg.initDataUnsafe.user.id) : 'test_user_chef';

        // Настройки Supabase
        const SUPABASE_URL = 'https://fxvporgpgpxudzlbauty.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ4dnBvcmdncGd4dWR6bGJhdXR5Iiwicm9sZSI6ImFub24iLCJpYXQiOjM3OTU5MjA5N30.placeholder_key_fix'; // Замени при необходимости на полный ключ, если требуется
        
        // Инициализация клиента Supabase (если ключей нет или ошибка — страхуемся локальным кэшем)
        let supabaseClient = null;
        try {
            if (window.supabase) {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }
        } catch (e) {
            console.error('Supabase init error:', e);
        }

        let currentMode = 'simple';
        let recipes = [];
        let activeMultiplier = 1;

        // Переключение режимов Дом / Pro
        function setMode(mode) {
            currentMode = mode;
            document.getElementById('btnSimple').classList.toggle('active', mode === 'simple');
            document.getElementById('btnPro').classList.toggle('active', mode === 'pro');
            renderRecipesList();
        }

        // Открытие/скрытие конструктора
        function openConstructor() {
            const constructor = document.getElementById('recipeConstructor');
            const isHidden = constructor.style.display === 'none';
            constructor.style.display = isHidden ? 'block' : 'none';
            if (isHidden && document.getElementById('ingredientsList').children.length === 0) {
                addIngredientRow('Продукт 1', 100, 'г');
                addStepRow('Подготовить ингредиенты и начать приготовление.');
            }
        }

        function handleTitleInput(val) {
            const body = document.getElementById('dynamicFormBody');
            body.style.display = val.trim().length > 0 ? 'block' : 'none';
        }

        function syncPortions(source, val) {
            const range = document.getElementById('recipePortionsRange');
            const input = document.getElementById('recipePortionsInput');
            
            if (source === 'range') {
                input.value = val;
                if (range) range.style.display = 'block';
            } else {
                let num = parseInt(val) || 1;
                if (range) {
                    if (num > 20) {
                        range.style.display = 'none';
                    } else {
                        range.style.display = 'block';
                        range.value = num;
                    }
                }
            }
            saveDraftLocally();
        }

        function addIngredientRow(name = '', amount = '', unit = 'г') {
            const container = document.getElementById('ingredientsList');
            const row = document.createElement('div');
            row.style.cssText = 'display: flex; gap: 6px; align-items: center;';
            row.innerHTML = `
                <input type="text" placeholder="Продукт" value="${name}" class="ing-name" style="flex: 2; margin: 0;">
                <input type="number" placeholder="Вес" value="${amount}" class="ing-amount" style="flex: 1; margin: 0;">
                <select class="ing-unit" style="flex: 1; margin: 0;">
                    <option value="г" ${unit==='г'?'selected':''}>г</option>
                    <option value="кг" ${unit==='кг'?'selected':''}>кг</option>
                    <option value="мл" ${unit==='мл'?'selected':''}>мл</option>
                    <option value="л" ${unit==='л'?'selected':''}>л</option>
                    <option value="шт" ${unit==='шт'?'selected':''}>шт</option>
                </select>
                <button type="button" onclick="this.parentElement.remove()" style="background: none; border: none; color: #ff5252; cursor: pointer; font-weight: bold; padding: 5px;">✕</button>
            `;
            container.appendChild(row);
        }

        function addStepRow(stepText = '', method = 'жарить') {
            const container = document.getElementById('stepsList');
            const methods = ['жар', 'пар', 'жар/пар', 'варить', 'жарить', 'бланшировать', 'тушить', 'колеровать', 'гриль'];
            let optionsHtml = methods.map(m => `<option value="${m}" ${m === method ? 'selected' : ''}>${m}</option>`).join('');

            const row = document.createElement('div');
            row.className = 'step-row';
            row.style.cssText = 'display: flex; flex-direction: column; gap: 6px; padding: 10px; background: var(--bg-color); border-radius: 8px; border: 1px solid var(--hint-color);';
            row.innerHTML = `
                <div style="display: flex; gap: 8px; align-items: center;">
                    <select style="flex: 1; margin: 0; padding: 6px;" class="step-method">
                        ${optionsHtml}
                    </select>
                    <button type="button" onclick="this.closest('.step-row').remove()" style="background: none; border: none; color: #ff5252; cursor: pointer; font-weight: bold;">✕</button>
                </div>
                <textarea placeholder="Описание шага приготовления..." class="step-desc" style="width: 100%; margin: 0; padding: 6px; resize: vertical;" rows="2">${stepText}</textarea>
            `;
            container.appendChild(row);
        }

        // Загрузка рецептов из Supabase
        async function loadRecipesFromSupabase() {
            const container = document.getElementById('recipesContainer');
            container.innerHTML = '<p style="color: var(--hint-color); text-align: center;">Загрузка из базы...</p>';

            if (!supabaseClient) {
                loadRecipesFallback();
                return;
            }

            try {
                const { data, error } = await supabaseClient
                    .from('recipes')
                    .select('*')
                    .eq('user_id', userId);

                if (error) throw error;
                recipes = data || [];
                if (recipes.length === 0) {
                    loadRecipesFallback();
                } else {
                    renderRecipesList();
                }
            } catch (err) {
                console.error('Ошибка загрузки из Supabase:', err);
                loadRecipesFallback();
            }
        }

        function loadRecipesFallback() {
            const local = localStorage.getItem('chef_recipes_cache');
            if (local) {
                recipes = JSON.parse(local);
            } else {
                recipes = [
                    {
                        id: 'demo-1',
                        title: "Оссобуко по-милански (Демо)",
                        category: "Мясо и птица",
                        base_portions: 4,
                        ingredients: [{ name: "Голяшка телячья", amount: 800, unit: "г" }, { name: "Томаты в с/с", amount: 300, unit: "г" }],
                        steps: [{ method: "тушить", text: "Обжарить мясо, добавить томаты и тушить до мягкости." }]
                    }
                ];
            }
            renderRecipesList();
        }

        // Отрисовка списка рецептов
        function renderRecipesList() {
            const container = document.getElementById('recipesContainer');
            if (recipes.length === 0) {
                container.innerHTML = '<p style="color: var(--hint-color); text-align: center;">Список рецептов пуст</p>';
                return;
            }

            container.innerHTML = recipes.map((r, index) => {
                let portionsInfo = currentMode === 'pro' ? ` | Базовых порций: <b>${r.base_portions || r.portions || 4}</b>` : '';
                return `
                    <div class="card" onclick="openRecipeDetail('${r.id || index}')">
                        <h3 style="margin-bottom: 4px;">${r.title}</h3>
                        <div style="font-size: 12px; color: var(--hint-color);">Категория: ${r.category || 'Другое'}${portionsInfo}</div>
                    </div>
                `;
            }).join('');
        }

        // Открытие детального просмотра конкретного рецепта
        function openRecipeDetail(recipeId) {
            const recipe = recipes.find(r => String(r.id) === String(recipeId)) || recipes[recipeId];
            if (!recipe) return;

            document.getElementById('mainScreen').style.display = 'none';
            document.getElementById('recipeDetailScreen').style.display = 'block';

            const basePortions = recipe.base_portions || recipe.portions || 4;
            activeMultiplier = 1;

            let ingredientsHtml = (recipe.ingredients || []).map(ing => `
                <div class="ingredient-item" onclick="this.classList.toggle('checked')" style="display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px dashed var(--hint-color); cursor: pointer;">
                    <span>${ing.name}</span>
                    <b><span class="ing-val" data-base="${ing.amount}">${ing.amount}</span> ${ing.unit || 'г'}</b>
                </div>
            `).join('');

            let stepsHtml = (recipe.steps || []).map((step, idx) => `
                <div style="margin-bottom: 10px; padding: 8px; background: var(--bg-color); border-radius: 6px;">
                    <div style="font-size: 11px; color: var(--hint-color); margin-bottom: 2px;">Шаг ${idx + 1} [ Метод: ${step.method || 'обработка'} ]</div>
                    <div>${step.text || step}</div>
                </div>
            `).join('');

            let proPortionsBlock = currentMode === 'pro' ? `
                <div style="margin: 12px 0; background: var(--bg-color); padding: 10px; border-radius: 8px;">
                    <label style="font-size: 12px; color: var(--hint-color);">Пересчет порций (Текущие: <b id="currentPortionsLabel">${basePortions}</b>)</label>
                    <input type="range" min="1" max="50" value="${basePortions}" oninput="updateDetailPortions(this.value, ${basePortions})" style="width: 100%; margin-top: 6px;">
                </div>
            ` : '';

            document.getElementById('detailContent').innerHTML = `
                <h2 style="margin-bottom: 6px;">${recipe.title}</h2>
                <div style="font-size: 12px; color: var(--hint-color); margin-bottom: 12px;">Категория: ${recipe.category}</div>
                ${proPortionsBlock}
                <h4 style="margin-top: 14px;">Ингредиенты (кликните для зачеркивания):</h4>
                <div style="margin-bottom: 14px;">${ingredientsHtml || '<p style="color:var(--hint-color)">Нет ингредиентов</p>'}</div>
                <h4 style="margin-top: 14px;">Шаги приготовления:</h4>
                <div>${stepsHtml || '<p style="color:var(--hint-color)">Нет шагов</p>'}</div>
            `;
        }

        function closeRecipeDetail() {
            document.getElementById('recipeDetailScreen').style.display = 'none';
            document.getElementById('mainScreen').style.display = 'block';
        }

        // Пересчет граммовок в детальном просмотре для PRO режима
        function updateDetailPortions(newPortions, basePortions) {
            document.getElementById('currentPortionsLabel').innerText = newPortions;
            const mult = newPortions / basePortions;
            document.querySelectorAll('.ing-val').forEach(el => {
                const baseVal = parseFloat(el.getAttribute('data-base')) || 0;
                el.innerText = Math.round(baseVal * mult * 10) / 10;
            });
        }

        // Сохранение нового рецепта в базу Supabase
        async function saveNewRecipe() {
            const title = document.getElementById('recipeTitle').value.trim();
            const category = document.getElementById('recipeCategory').value;
            const basePortions = parseInt(document.getElementById('recipePortionsInput').value) || 4;

            if (!title) {
                alert('Пожалуйста, укажите название блюда!');
                return;
            }

            // Собираем ингредиенты
            const ingredients = [];
            document.querySelectorAll('#ingredientsList > div').forEach(row => {
                const name = row.querySelector('.ing-name')?.value || '';
                const amount = parseFloat(row.querySelector('.ing-amount')?.value) || 0;
                const unit = row.querySelector('.ing-unit')?.value || 'г';
                if (name) ingredients.push({ name, amount, unit });
            });

            // Собираем шаги
            const steps = [];
            document.querySelectorAll('#stepsList > .step-row').forEach(row => {
                const method = row.querySelector('.step-method')?.value || 'жарить';
                const text = row.querySelector('.step-desc')?.value || '';
                if (text) steps.push({ method, text });
            });

            const newRecipeData = {
                user_id: userId,
                title,
                category: category || 'Другое',
                base_portions: basePortions, // Корректное имя колонки со "s" в конце
                ingredients,
                steps
            };

            if (supabaseClient) {
                try {
                    const { error } = await supabaseClient
                        .from('recipes')
                        .insert([newRecipeData]);

                    if (error) throw error;
                    alert('Техкарта успешно сохранена в Supabase!');
                } catch (err) {
                    console.error('Ошибка сохранения в Supabase:', err);
                    alert('Ошибка сохранения в базу, рецепт сохранен локально.');
                    saveLocallyFallback(newRecipeData);
                }
            } else {
                saveLocallyFallback(newRecipeData);
            }

            // Очищаем форму и скрываем конструктор
            document.getElementById('recipeConstructor').style.display = 'none';
            document.getElementById('recipeTitle').value = '';
            discardDraft();
            loadRecipesFromSupabase();
        }

        function saveLocallyFallback(recipeData) {
            recipes.unshift(recipeData);
            localStorage.setItem('chef_recipes_cache', JSON.stringify(recipes));
        }

        function saveDraftLocally() {
            const draft = {
                title: document.getElementById('recipeTitle').value,
                category: document.getElementById('recipeCategory').value,
                portions: document.getElementById('recipePortionsInput').value
            };
            localStorage.setItem('chef_recipe_draft', JSON.stringify(draft));
        }

        function restoreDraft() {
            const draft = JSON.parse(localStorage.getItem('chef_recipe_draft'));
            if (draft) {
                document.getElementById('recipeTitle').value = draft.title || '';
                handleTitleInput(draft.title || '');
                document.getElementById('recipeCategory').value = draft.category || '';
                document.getElementById('recipePortionsInput').value = draft.portions || 4;
                syncPortions('input', draft.portions || 4);
            }
            document.getElementById('draftNotification').style.display = 'none';
        }

        function discardDraft() {
            localStorage.removeItem('chef_recipe_draft');
            document.getElementById('draftNotification').style.display = 'none';
        }

        // Запуск при загрузке страницы
        window.onload = function() {
            if (localStorage.getItem('chef_recipe_draft')) {
                document.getElementById('draftNotification').style.display = 'block';
            }
            loadRecipesFromSupabase();
        };
    </script>
</body>
</html>
