<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Блокнот Шефа</title>
    <!-- Подключаем Tailwind CSS для красивого и быстрого интерфейса -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Подключаем Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col">

    <!-- Шапка приложения -->
    <header class="bg-gray-800 border-b border-gray-700 p-4 sticky top-0 z-50 shadow-md">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-orange-400">🔪 Блокнот Шефа</h1>
            <!-- Переключатель Дом / Pro -->
            <div class="flex items-center bg-gray-700 rounded-lg p-1">
                <button id="modeDom" onclick="setMode('dom')" class="px-3 py-1 rounded-md text-xs font-medium transition bg-orange-500 text-white">Дом</button>
                <button id="modePro" onclick="setMode('pro')" class="px-3 py-1 rounded-md text-xs font-medium transition text-gray-300">Pro</button>
            </div>
        </div>
    </header>

    <!-- Основной контент -->
    <main class="flex-1 max-w-md w-full mx-auto p-4 pb-24">
        
        <!-- Кнопки управления -->
        <div id="navControlsContainer" class="flex gap-2 mb-6">
            <button onclick="openNewRecipeModal()" class="flex-1 bg-orange-500 hover:bg-orange-600 text-white font-medium py-2.5 px-4 rounded-xl shadow transition flex items-center justify-center gap-2">
                <span>+ Новая техкарта</span>
            </button>
            <button onclick="loadDemoRecipes()" class="bg-gray-700 hover:bg-gray-600 text-gray-300 font-medium py-2.5 px-3 rounded-xl transition text-sm">
                📥 Демо
            </button>
        </div>

        <!-- Статус загрузки / ошибки -->
        <div id="statusMessage" class="text-center text-gray-400 py-8 text-sm">
            Загрузка рецептов из облака...
        </div>

        <!-- Список рецептов -->
        <div id="recipesList" class="space-y-4">
            <!-- Динамически заполняется скриптом -->
        </div>

        <!-- Экран детального просмотра рецепта (скрыт по умолчанию) -->
        <div id="recipeDetailView" class="hidden space-y-4">
            <button onclick="closeRecipeDetail()" class="bg-gray-700 hover:bg-gray-600 text-gray-300 px-3 py-1.5 rounded-xl text-xs font-medium transition mb-2">
                ← Назад к списку
            </button>
            <div class="bg-gray-800 border border-gray-700 rounded-2xl p-5 shadow-lg">
                <div class="flex justify-between items-start mb-3">
                    <h2 id="detailTitle" class="text-xl font-bold text-white"></h2>
                    <span id="detailCategory" class="bg-gray-700 text-orange-400 text-xs px-2.5 py-1 rounded-full font-medium"></span>
                </div>
                <div id="detailProInfo" class="mb-4 text-xs text-orange-300 hidden">
                    Базовые порции: <b id="detailPortions">1</b>
                </div>
                <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Шаги приготовления:</h3>
                <p id="detailSteps" class="text-gray-300 text-sm whitespace-pre-line bg-gray-900 p-3 rounded-xl border border-gray-700/50"></p>
            </div>
        </div>
    </main>

    <!-- Модальное окно создания / редактирования рецепта -->
    <div id="recipeModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="bg-gray-800 border border-gray-700 w-full max-w-md rounded-2xl p-5 shadow-2xl max-h-[90vh] overflow-y-auto">
            <h2 id="modalTitle" class="text-lg font-bold text-orange-400 mb-4">Новая техкарта</h2>
            
            <form id="recipeForm" onsubmit="saveRecipe(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1">Название блюда</label>
                    <input type="text" id="recipeTitle" required class="w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-orange-500" placeholder="Например: Оссобуко по-милански">
                </div>

                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1">Категория</label>
                    <select id="recipeCategory" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-orange-500">
                        <option value="Основное блюдо">Основное блюдо</option>
                        <option value="Супы">Супы</option>
                        <option value="Салаты">Салаты</option>
                        <option value="Соусы">Соусы</option>
                        <option value="Заготовки">Заготовки</option>
                    </select>
                </div>

                <div id="proPortionsContainer" class="hidden">
                    <label class="block text-xs font-medium text-gray-400 mb-1">Базовые порции (Pro)</label>
                    <input type="number" id="recipeBasePortions" value="1" min="1" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-orange-500">
                </div>

                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1">Шаги приготовления</label>
                    <textarea id="recipeSteps" rows="3" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-orange-500" placeholder="Опишите процесс приготовления..."></textarea>
                </div>

                <div class="flex gap-3 pt-2">
                    <button type="button" onclick="closeModal()" class="flex-1 bg-gray-700 hover:bg-gray-600 text-gray-300 font-medium py-2 rounded-xl transition text-sm">Отмена</button>
                    <button type="submit" class="flex-1 bg-orange-500 hover:bg-orange-600 text-white font-medium py-2 rounded-xl transition text-sm">Сохранить</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Скрипт логики и подключения к Supabase -->
    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
        }
        const userId = tg?.initDataUnsafe?.user?.id ? String(tg.initDataUnsafe.user.id) : 'test_chef_user';

        // Твои жестко прописанные доступы к Supabase
        const SUPABASE_URL = 'https://fxvporgpgpxudzlbauty.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_kcUT9hJ_k8e-2sj0j8BbAA_QvG8Wc-p';

        // Инициализация клиента Supabase
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentMode = 'dom'; // 'dom' или 'pro'
        let recipes = [];

        // Переключение режимов
        function setMode(mode) {
            currentMode = mode;
            const btnDom = document.getElementById('modeDom');
            const btnPro = document.getElementById('modePro');
            const proContainer = document.getElementById('proPortionsContainer');

            if (mode === 'dom') {
                btnDom.className = 'px-3 py-1 rounded-md text-xs font-medium transition bg-orange-500 text-white';
                btnPro.className = 'px-3 py-1 rounded-md text-xs font-medium transition text-gray-300';
                proContainer.classList.add('hidden');
            } else {
                btnPro.className = 'px-3 py-1 rounded-md text-xs font-medium transition bg-orange-500 text-white';
                btnDom.className = 'px-3 py-1 rounded-md text-xs font-medium transition text-gray-300';
                proContainer.classList.remove('hidden');
            }
            renderRecipes();
        }

        // Загрузка рецептов из Supabase
        async function fetchRecipes() {
            const statusEl = document.getElementById('statusMessage');
            statusEl.textContent = 'Загрузка рецептов из облака...';
            statusEl.classList.remove('hidden');

            try {
                const { data, error } = await supabaseClient
                    .from('recipes')
                    .select('*')
                    .eq('user_id', userId);

                if (error) throw error;

                recipes = data || [];
                statusEl.classList.add('hidden');
                
                // Страховка в localStorage
                localStorage.setItem('chef_recipes_cache', JSON.stringify(recipes));
                
                renderRecipes();
            } catch (err) {
                console.error('Ошибка загрузки:', err.message);
                const cached = localStorage.getItem('chef_recipes_cache');
                if (cached) {
                    recipes = JSON.parse(cached);
                    statusEl.textContent = '⚠️ Ошибка сети. Показаны данные из кэша.';
                    renderRecipes();
                } else {
                    statusEl.textContent = 'Не удалось загрузить рецепты из облака. Проверьте подключение.';
                }
            }
        }

        // Рендер списка рецептов на экране
        function renderRecipes() {
            const listEl = document.getElementById('recipesList');
            listEl.innerHTML = '';

            if (recipes.length === 0) {
                listEl.innerHTML = '<div class="text-center text-gray-500 py-6 text-sm">Пока нет сохраненных техкарт. Нажми «+ Новая техкарта» или загрузи демо.</div>';
                return;
            }

            recipes.forEach((recipe) => {
                const card = document.createElement('div');
                // Добавлены классы cursor-pointer и hover для кликабельности
                card.className = 'bg-gray-800 border border-gray-700 rounded-2xl p-4 shadow-md cursor-pointer hover:border-orange-500 transition';
                
                // Обработчик клика по карточке
                card.onclick = () => openRecipeDetail(recipe.id);
                
                let proDetails = '';
                if (currentMode === 'pro') {
                    proDetails = `
                        <div class="mt-3 pt-3 border-t border-gray-700 text-xs text-orange-300 flex justify-between">
                            <span>Базовые порции: <b>${recipe.base_portions || 1}</b></span>
                            <span class="text-gray-400">ID: ${recipe.id ? recipe.id.slice(0, 8) : ''}</span>
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <h3 class="font-bold text-base text-white">${escapeHtml(recipe.title)}</h3>
                        <span class="bg-gray-700 text-orange-400 text-[10px] px-2 py-0.5 rounded-full font-medium">${escapeHtml(recipe.category)}</span>
                    </div>
                    <p class="text-gray-400 text-xs line-clamp-2 mb-2">${escapeHtml(recipe.steps || 'Без описания шагов')}</p>
                    ${proDetails}
                `;
                listEl.appendChild(card);
            });
        }

        // Открытие детального просмотра рецепта
        function openRecipeDetail(recipeId) {
            const recipe = recipes.find(r => r.id === recipeId);
            if (!recipe) return;

            document.getElementById('detailTitle').textContent = recipe.title;
            document.getElementById('detailCategory').textContent = recipe.category;
            document.getElementById('detailSteps').textContent = recipe.steps || 'Шаги приготовления не указаны.';

            const proInfo = document.getElementById('detailProInfo');
            if (currentMode === 'pro') {
                document.getElementById('detailPortions').textContent = recipe.base_portions || 1;
                proInfo.classList.remove('hidden');
            } else {
                proInfo.classList.add('hidden');
            }

            // Переключаем видимость экранов
            document.getElementById('recipesList').classList.add('hidden');
            document.getElementById('navControlsContainer').classList.add('hidden');
            document.getElementById('statusMessage').classList.add('hidden');
            document.getElementById('recipeDetailView').classList.remove('hidden');
        }

        // Закрытие детального просмотра
        function closeRecipeDetail() {
            document.getElementById('recipeDetailView').classList.add('hidden');
            document.getElementById('recipesList').classList.remove('hidden');
            document.getElementById('navControlsContainer').classList.remove('hidden');
            renderRecipes();
        }

        // Открытие модального окна создания
        function openNewRecipeModal() {
            document.getElementById('recipeForm').reset();
            document.getElementById('recipeModal').classList.remove('hidden');
        }

        // Закрытие модального окна
        function closeModal() {
            document.getElementById('recipeModal').classList.add('hidden');
        }

        // Сохранение рецепта в Supabase
        async function saveRecipe(event) {
            event.preventDefault();
            
            const title = document.getElementById('recipeTitle').value.trim();
            const category = document.getElementById('recipeCategory').value;
            const base_portions = parseInt(document.getElementById('recipeBasePortions').value) || 1;
            const steps = document.getElementById('recipeSteps').value.trim();

            if (!title) return;

            const newRecipe = {
                user_id: userId,
                title: title,
                category: category,
                base_portions: base_portions,
                steps: steps,
                photo_file_id: ''
            };

            try {
                const { data, error } = await supabaseClient
                    .from('recipes')
                    .insert([newRecipe])
                    .select();

                if (error) throw error;

                if (data && data.length > 0) {
                    recipes.unshift(data[0]);
                    localStorage.setItem('chef_recipes_cache', JSON.stringify(recipes));
                    renderRecipes();
                }

                closeModal();
            } catch (err) {
                console.error('Ошибка сохранения:', err.message);
                alert('Не удалось сохранить рецепт в базу: ' + err.message);
            }
        }

        // Загрузка демо-рецепта
        async function loadDemoRecipes() {
            const demoRecipe = {
                user_id: userId,
                title: 'Оссобуко по-милански',
                category: 'Основное блюдо',
                base_portions: 4,
                steps: '1. Обжарить говяжью голяшку. 2. Добавить овощи, белое вино и бульон. 3. Тушить на медленном огне 2.5 часа.',
                photo_file_id: ''
            };

            try {
                const { data, error } = await supabaseClient
                    .from('recipes')
                    .insert([demoRecipe])
                    .select();

                if (error) throw error;
                if (data) {
                    recipes.unshift(data[0]);
                    localStorage.setItem('chef_recipes_cache', JSON.stringify(recipes));
                    renderRecipes();
                }
            } catch (err) {
                console.error('Демо ошибка:', err.message);
                alert('Ошибка загрузки демо: ' + err.message);
            }
        }

        // Экранирование для безопасности текста
        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // Запускаем загрузку при старте
        fetchRecipes();
    </script>
</body>
</html>
